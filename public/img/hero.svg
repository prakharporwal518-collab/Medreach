<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t">
  <title id="t">A phone showing Sehat Setu guiding an ambulance to a hospital that has accepted the patient</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff3f1"/><stop offset="1" stop-color="#eaf1ff"/></linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="hosp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8eef8"/></linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".18"/></filter>
  </defs>
  <!-- backdrop -->
  <rect x="20" y="30" width="600" height="440" rx="200" fill="url(#sky)"/>
  <circle cx="520" cy="90" r="34" fill="#fde68a"/>
  <g fill="#ffffff" opacity=".9"><ellipse cx="140" cy="110" rx="46" ry="14"/><ellipse cx="170" cy="100" rx="30" ry="16"/><ellipse cx="430" cy="140" rx="40" ry="12"/><ellipse cx="455" cy="131" rx="24" ry="13"/></g>
  <!-- skyline -->
  <g fill="#c7d6ea">
    <rect x="70" y="250" width="50" height="150" rx="4"/><rect x="128" y="220" width="40" height="180" rx="4"/>
    <rect x="480" y="230" width="46" height="170" rx="4"/><rect x="532" y="270" width="44" height="130" rx="4"/>
  </g>
  <g fill="#e6eef9"><rect x="80" y="265" width="10" height="10"/><rect x="98" y="265" width="10" height="10"/><rect x="80" y="290" width="10" height="10"/><rect x="98" y="290" width="10" height="10"/><rect x="137" y="235" width="8" height="10"/><rect x="152" y="235" width="8" height="10"/><rect x="137" y="258" width="8" height="10"/><rect x="152" y="258" width="8" height="10"/><rect x="490" y="245" width="9" height="10"/><rect x="507" y="245" width="9" height="10"/><rect x="490" y="268" width="9" height="10"/><rect x="507" y="268" width="9" height="10"/></g>
  <!-- hospital -->
  <g filter="url(#sh)">
    <rect x="300" y="170" width="190" height="230" rx="10" fill="url(#hosp)"/>
    <rect x="300" y="170" width="190" height="34" rx="10" fill="#0f9488"/>
    <text x="395" y="193" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" letter-spacing="1.5">HOSPITAL</text>
  </g>
  <rect x="373" y="120" width="44" height="44" rx="10" fill="#fff" stroke="#e11d48" stroke-width="3"/>
  <path d="M388 128h14v10h10v14h-10v10h-14v-10h-10v-14h10z" fill="#e11d48" transform="translate(0 -2) scale(1)"/>
  <g fill="#bfdbfe"><rect x="318" y="222" width="30" height="24" rx="4"/><rect x="380" y="222" width="30" height="24" rx="4"/><rect x="442" y="222" width="30" height="24" rx="4"/><rect x="318" y="262" width="30" height="24" rx="4"/><rect x="380" y="262" width="30" height="24" rx="4"/><rect x="442" y="262" width="30" height="24" rx="4"/><rect x="318" y="302" width="30" height="24" rx="4"/><rect x="442" y="302" width="30" height="24" rx="4"/></g>
  <rect x="370" y="330" width="50" height="70" rx="4" fill="#0f9488"/>
  <rect x="393" y="330" width="4" height="70" fill="#0b7a70"/>
  <!-- accepted pin above hospital -->
  <g transform="translate(470 96)">
    <circle cx="0" cy="0" r="30" fill="#16a34a" opacity=".15"/>
    <path d="M0 22s-16-13-16-25a16 16 0 0 1 32 0c0 12-16 25-16 25z" fill="#16a34a"/>
    <path d="M-7 -4l5 5 9-10" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- road -->
  <rect x="20" y="400" width="600" height="60" fill="#334155"/>
  <g stroke="#f8fafc" stroke-width="4" stroke-dasharray="26 18"><path d="M20 430h600"/></g>
  <!-- ambulance -->
  <g transform="translate(410 352)" filter="url(#sh)">
    <path d="M0 58V14a8 8 0 0 1 8-8h96v52z" fill="#ffffff"/>
    <path d="M104 22h28l26 22v14h-54z" fill="#ffffff"/>
    <path d="M110 27h20l18 16h-38z" fill="#93c5fd"/>
    <rect x="0" y="36" width="158" height="8" fill="#e11d48"/>
    <path d="M42 16h12v10h10v12h-10v10H42V38H32V26h10z" fill="#e11d48" transform="translate(0 -6) scale(1)"/>
    <rect x="46" y="-4" width="22" height="10" rx="3" fill="#2563eb"/>
    <circle cx="36" cy="62" r="13" fill="#0f172a"/><circle cx="36" cy="62" r="5" fill="#cbd5e1"/>
    <circle cx="124" cy="62" r="13" fill="#0f172a"/><circle cx="124" cy="62" r="5" fill="#cbd5e1"/>
    <path d="M-18 22h-22M-12 34h-30M-18 46h-18" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- phone -->
  <g transform="translate(70 120)" filter="url(#sh)">
    <rect x="0" y="0" width="190" height="360" rx="30" fill="url(#phone)"/>
    <rect x="10" y="12" width="170" height="336" rx="22" fill="#f8fafc"/>
    <rect x="70" y="20" width="50" height="7" rx="3.5" fill="#1e293b"/>
    <!-- app header -->
    <rect x="10" y="34" width="170" height="40" fill="#0f9488"/>
    <circle cx="32" cy="54" r="11" fill="#fff"/><path d="M29.5 47h5v4.5H39v5h-4.5V61h-5v-4.5H25v-5h4.5z" fill="#e11d48"/>
    <text x="50" y="59" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#fff">Sehat Setu</text>
    <!-- map -->
    <rect x="20" y="84" width="150" height="120" rx="12" fill="#e2f0ea"/>
    <path d="M20 130h150M60 84v120M120 84v120" stroke="#cfe3d9" stroke-width="6"/>
    <path d="M44 184 C 70 150, 100 170, 150 108" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round"/>
    <circle cx="44" cy="184" r="7" fill="#2563eb" stroke="#fff" stroke-width="3"/>
    <path d="M150 116s-10-8-10-15a10 10 0 0 1 20 0c0 7-10 15-10 15z" fill="#e11d48"/>
    <circle cx="150" cy="101" r="3.5" fill="#fff"/>
    <!-- accepted card -->
    <rect x="20" y="214" width="150" height="58" rx="12" fill="#ecfdf3" stroke="#bbf7d0"/>
    <circle cx="40" cy="236" r="10" fill="#16a34a"/><path d="M35 236l3.5 3.5 6-7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="56" y="233" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#14532d">Referral accepted</text>
    <text x="56" y="247" font-family="Inter, Arial, sans-serif" font-size="9" fill="#166534">Bay Resus-02 ready</text>
    <rect x="32" y="256" width="126" height="6" rx="3" fill="#bbf7d0"/><rect x="32" y="256" width="84" height="6" rx="3" fill="#16a34a"/>
    <!-- SOS button -->
    <rect x="20" y="284" width="150" height="46" rx="14" fill="#e11d48"/>
    <text x="95" y="312" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">🎙  Tap &amp; speak</text>
  </g>
  <!-- floating verified chip -->
  <g transform="translate(250 60)" filter="url(#sh)">
    <rect width="150" height="44" rx="14" fill="#fff"/>
    <circle cx="22" cy="22" r="6" fill="#16a34a"/>
    <text x="36" y="19" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#0f172a">ICU verified</text>
    <text x="36" y="33" font-family="Inter, Arial, sans-serif" font-size="10" fill="#64748b">2 min ago · 3 beds</text>
  </g>
</svg>

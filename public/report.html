<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sehat Setu – Emergency Help</title>
  <meta name="description" content="AI emergency assistant: understands the emergency, finds a hospital that can treat it right now, gets acceptance and guides you there.">
  <meta name="theme-color" content="#0b7a75">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <img src="/icons/icon.svg" alt="">
      <span>Sehat Setu <small data-i18n="tagline"></small></span>
    </a>
    <span class="spacer"></span>
    <a id="portalLink" class="portal-link" href="/login?role=citizen">Sign in</a>
    <div class="pill-toggle" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="hi">हिं</button>
    </div>
    <a class="call-108" href="tel:108">📞 <span data-i18n="call108"></span></a>
  </header>
  <div id="offline" class="offline-banner hidden" data-i18n="offline" role="status"></div>
  <div id="demoBanner" class="demo-banner hidden" role="note"><b>DEMO</b> <span data-i18n="demoBanner"></span></div>

  <main>
    <ol class="stepper" id="stepper" aria-hidden="true"></ol>
    <p class="step-caption" id="stepCaption"></p>
    <div id="alonePanel" class="alone-panel hidden" role="status" aria-live="polite"></div>
    <div id="trackPage" class="hidden"></div>

    <!-- ① SUDDEN EMERGENCY -->
    <section id="step-0" class="step">
      <div class="card">
        <h1 class="hero-title" data-i18n="heroTitle"></h1>
        <p class="muted" data-i18n="heroSub"></p>
        <div class="mic-wrap">
          <button id="micBtn" class="mic" type="button" aria-label="Speak">🎙️</button>
          <span id="micLabel" class="mic-label" data-i18n="tapToSpeak"></span>
        </div>
        <textarea id="describe" class="describe" rows="3" aria-label="Describe the emergency"></textarea>
        <h3 class="small muted" style="margin-top:.75rem" data-i18n="quickPick"></h3>
        <div class="chips" id="chips"></div>
      </div>

      <div class="card alone-card">
        <button id="aloneBtn" class="btn alone lg block" type="button">
          <span data-i18n="aloneBtn"></span>
        </button>
        <p class="small muted" data-i18n="aloneSub" style="margin:.5rem 0 .25rem"></p>
        <details class="contact">
          <summary class="small" data-i18n="contactTitle"></summary>
          <div id="contactBox" style="margin-top:.5rem"></div>
        </details>
      </div>

      <div class="card">
        <h3 class="small muted" data-i18n="addInfo"></h3>
        <div class="attach-grid">
          <label class="attach" id="photoAttach">
            <strong data-i18n="photo"></strong><span data-i18n="photoHint"></span>
            <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
          </label>
          <label class="attach" id="scanAttach">
            <strong data-i18n="scan"></strong><span data-i18n="scanHint"></span>
            <input id="scanInput" type="file" accept="image/*" hidden>
          </label>
        </div>
        <div id="photoResult" class="small"></div>
        <div id="scanResult" class="small"></div>
        <div id="patientForm" class="hidden" style="margin-top:.75rem">
          <h3 class="small" data-i18n="patientDetails"></h3>
          <div class="form-grid">
            <label>Name<input data-field="name"></label>
            <label>Age<input data-field="age" inputmode="numeric"></label>
            <label>Gender<input data-field="gender"></label>
            <label>Blood group<input data-field="bloodGroup"></label>
            <label>ABHA ID<input data-field="abhaId"></label>
            <label>Ayushman ID<input data-field="ayushmanId"></label>
            <label class="full">Known conditions<input data-field="conditions"></label>
            <label class="full">Allergies<input data-field="allergies"></label>
            <label class="full">Medicines<input data-field="medicines"></label>
          </div>
        </div>
      </div>

      <div style="margin-top:1rem">
        <button id="helpBtn" class="btn danger lg block" type="button" data-i18n="getHelp"></button>
      </div>
      <p class="small muted" style="text-align:center;margin-top:.75rem">
        <button id="privacyBtn" class="linkish" type="button" data-i18n="privacyLink"></button>
      </p>
    </section>

    <!-- ② AI UNDERSTANDS WHAT IS HAPPENING -->
    <section id="step-1" class="step hidden" aria-live="polite"></section>

    <!-- ③ GET USER LOCATION -->
    <section id="step-2" class="step hidden">
      <div class="card">
        <div class="card-title"><span class="icon">📍</span><h2 data-i18n="yourLocation"></h2></div>
        <p id="locStatus" class="small muted"></p>
        <div id="locMap" class="map"></div>
        <p class="small muted" data-i18n="tapMap"></p>
        <div class="row">
          <button id="demoLocBtn" class="btn ghost" type="button" data-i18n="useDemo"></button>
          <span class="grow"></span>
          <button id="confirmLocBtn" class="btn primary" type="button" data-i18n="confirmLoc"></button>
        </div>
      </div>
    </section>

    <!-- ④ FIND SUITABLE HOSPITALS (capability + status → distance + ETA → options) -->
    <section id="step-3" class="step hidden"></section>

    <!-- ⑤ HOSPITAL CONFIRMS ACCEPTANCE -->
    <section id="step-4" class="step hidden" aria-live="polite"></section>

    <!-- ⑥ TRANSPORT -->
    <section id="step-5" class="step hidden"></section>

    <!-- ⑦ NAVIGATION -->
    <section id="step-6" class="step hidden"></section>

    <!-- ⑧ CONFIRMED HOSPITAL -->
    <section id="step-7" class="step hidden"></section>
  </main>

  <dialog id="privacyDialog" class="dialog">
    <h2 data-i18n="privacyTitle"></h2>
    <ul id="privacyList" class="small"></ul>
    <button class="btn primary" type="button" data-close>OK</button>
  </dialog>
  <dialog id="trackDialog" class="dialog wide">
    <div id="trackBody"></div>
    <button class="btn" type="button" data-close>✕</button>
  </dialog>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>

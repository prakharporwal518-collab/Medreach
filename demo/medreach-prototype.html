* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: .75rem; padding: .6rem 1rem; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header img { width: 30px; height: 30px; }
header h1 { font-size: 1rem; margin: 0; }
header p { margin: 0; font-size: .8rem; color: var(--muted); }
.spacer { flex: 1; }
.toggle { display: inline-flex; align-items: center; gap: .45rem; font-size: .85rem; cursor: pointer; user-select: none; }
.toggle input { width: 18px; height: 18px; accent-color: var(--brand); }
.tabs { display: none; gap: .4rem; padding: .5rem 1rem 0; }
.tabs button { flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: .55rem; font: inherit; font-weight: 600; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.stage { flex: 1; display: grid; grid-template-columns: 420px 1fr; gap: 1rem; padding: 1rem; min-height: 0; }
.pane { display: flex; flex-direction: column; min-height: 0; }
.pane h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 .5rem; }
.phone { flex: 1; border: 10px solid var(--phone); border-radius: 36px; overflow: hidden; background: #fff; box-shadow: 0 20px 50px rgba(15,27,45,.25); max-height: 880px; min-height: 0; }
.desk { flex: 1; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); min-height: 0; }
iframe { width: 100%; height: 100%; border: 0; display: block; }
.toast { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%) translateY(150%); background: var(--ink); color: var(--bg); padding: .75rem 1rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.3); display: flex; gap: .75rem; align-items: center; transition: transform .25s; max-width: calc(100% - 2rem); z-index: 10; }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast button { border: 0; background: var(--sos); color: #fff; border-radius: 8px; padding: .4rem .7rem; font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap; }
@media (min-width: 901px) { .toast button { display: none; } }
@media (max-width: 900px) {
  .tabs { display: flex; }
  .stage { grid-template-columns: 1fr; padding: .5rem 0 0; }
  .pane h2 { display: none; }
  .pane.hidden-mobile { display: none; }
  .phone { border: 0; border-radius: 0; box-shadow: none; max-height: none; }
  .desk { border: 0; border-radius: 0; }
}

093E\u090F \u0930\u0916\u0947\u0902\u0964","\u0938\u093E\u0901\u0938 \u091A\u0932 \u0930\u0939\u0940 \u0939\u094B \u0924\u094B \u0939\u0947\u0932\u092E\u0947\u091F \u0928 \u0909\u0924\u093E\u0930\u0947\u0902\u0964 \u092A\u093E\u0928\u0940 \u0928 \u0926\u0947\u0902\u0964"]}},breathing:{label:H("Severe breathing difficulty","\u0938\u093E\u0901\u0938 \u0932\u0947\u0928\u0947 \u092E\u0947\u0902 \u0917\u0902\u092D\u0940\u0930 \u0924\u0915\u0932\u0940\u092B\u093C"),icon:"\u{1FAC1}",base:"serious",golden:60,required:["emergency","icu"],preferred:["ventilator"],keywords:[["breathing",3],["breathless",5],["shortness of breath",5],["asthma",5],["wheez",4],["choking",4],["saans",4],["sans",3],["saas",3],["\u0938\u093E\u0902\u0938",4],["\u0938\u093E\u0901\u0938",4],["dama",4],["\u0926\u092E\u093E",5],["dum ghut",5],["\u0926\u092E \u0918\u0941\u091F",5],["oxygen",3]],firstAid:{en:["Help them sit upright and lean slightly forward; open windows for fresh air.","If they have an asthma inhaler, help them take 1 puff every 30\u201360 seconds (up to 10 puffs).","If choking on food: give 5 firm back blows between the shoulder blades, then 5 abdominal thrusts.","Loosen tight clothing. Keep them calm \u2013 panic makes breathing worse."],hi:["\u0909\u0928\u094D\u0939\u0947\u0902 \u0938\u0940\u0927\u093E \u092C\u0948\u0920\u093E\u090F\u0901 \u0914\u0930 \u0925\u094B\u0921\u093C\u093E \u0906\u0917\u0947 \u091D\u0941\u0915\u093E\u090F\u0901; \u0924\u093E\u091C\u093C\u0940 \u0939\u0935\u093E \u0915\u0947 \u0932\u093F\u090F \u0916\u093F\u0921\u093C\u0915\u0940 \u0916\u094B\u0932\u0947\u0902\u0964","\u0905\u0917\u0930 \u0905\u0938\u094D\u0925\u092E\u093E \u0907\u0928\u0939\u0947\u0932\u0930 \u0939\u0948 \u0924\u094B \u0939\u0930 30\u201360 \u0938\u0947\u0915\u0902\u0921 \u092E\u0947\u0902 1 \u092A\u092B\u093C \u0926\u093F\u0932\u093E\u090F\u0901 (10 \u092A\u092B\u093C \u0924\u0915)\u0964","\u0916\u093E\u0928\u093E \u0905\u091F\u0915\u093E \u0939\u094B \u0924\u094B: \u0915\u0902\u0927\u094B\u0902 \u0915\u0947 \u092C\u0940\u091A 5 \u091C\u093C\u094B\u0930\u0926\u093E\u0930 \u0925\u092A\u0915\u0940, \u092B\u093F\u0930 5 \u092C\u093E\u0930 \u092A\u0947\u091F \u092A\u0930 \u0926\u092C\u093E\u0935 (\u0939\u0947\u092E\u0932\u093F\u0915)\u0964","\u0924\u0902\u0917 \u0915\u092A\u0921\u093C\u0947 \u0922\u0940\u0932\u0947 \u0915\u0930\u0947\u0902\u0964 \u0909\u0928\u094D\u0939\u0947\u0902 \u0936\u093E\u0902\u0924 \u0930\u0916\u0947\u0902 \u2013 \u0918\u092C\u0930\u093E\u0939\u091F \u0938\u0947 \u0938\u093E\u0901\u0938 \u0914\u0930 \u092C\u093F\u0917\u0921\u093C\u0924\u0940 \u0939\u0948\u0964"]}},burns:{label:H("Burns","\u091C\u0932\u0928\u093E"),icon:"\u{1F525}",base:"serious",golden:120,required:["emergency","burns"],preferred:["icu","blood_bank"],keywords:[["burn",5],["fire",3],["scald",5],["acid",5],["cylinder blast",6],["jal gaya",6],["jal gayi",6],["jala",3],["\u091C\u0932 \u0917\u092F\u093E",6],["\u091C\u0932 \u0917\u0908",6],["\u091C\u0932\u093E",4],["\u091C\u0932\u0940",4],["aag",4],["\u0906\u0917",4],["tezab",6],["\u0924\u0947\u091C\u093C\u093E\u092C",6],["\u0924\u0947\u091C\u093E\u092C",6],["garam pani",4],["\u0917\u0930\u092E \u092A\u093E\u0928\u0940",4]],firstAid:{en:["Cool the burn under cool (not ice-cold) running water for 20 minutes.","Remove rings, watches and clothing near the burn \u2013 unless stuck to the skin.","Cover loosely with clean cling film or a clean plastic bag. Do not apply toothpaste, ghee or ice.","For acid: rinse with plenty of running water for at least 20 minutes."],hi:["\u091C\u0932\u0947 \u0939\u093F\u0938\u094D\u0938\u0947 \u0915\u094B 20 \u092E\u093F\u0928\u091F \u0924\u0915 \u0920\u0902\u0921\u0947 (\u092C\u0930\u094D\u092B\u093C\u0940\u0932\u0947 \u0928\u0939\u0940\u0902) \u092C\u0939\u0924\u0947 \u092A\u093E\u0928\u0940 \u092E\u0947\u0902 \u0930\u0916\u0947\u0902\u0964","\u091C\u0932\u0947 \u0939\u093F\u0938\u094D\u0938\u0947 \u0915\u0947 \u092A\u093E\u0938 \u0938\u0947 \u0905\u0901\u0917\u0942\u0920\u0940, \u0918\u0921\u093C\u0940, \u0915\u092A\u0921\u093C\u0947 \u0939\u091F\u093E\u090F\u0901 \u2013 \u0905\u0917\u0930 \u0924\u094D\u0935\u091A\u093E \u0938\u0947 \u091A\u093F\u092A\u0915\u0947 \u0928 \u0939\u094B\u0902\u0964","\u0938\u093E\u092B\u093C \u0915\u094D\u0932\u093F\u0902\u0917 \u092B\u093C\u093F\u0932\u094D\u092E \u092F\u093E \u0938\u093E\u092B\u093C \u092A\u094D\u0932\u093E\u0938\u094D\u091F\u093F\u0915 \u0938\u0947 \u0922\u0940\u0932\u093E \u0922\u0915\u0947\u0902\u0964 \u091F\u0942\u0925\u092A\u0947\u0938\u094D\u091F, \u0918\u0940 \u092F\u093E \u092C\u0930\u094D\u092B\u093C \u0928 \u0932\u0917\u093E\u090F\u0901\u0964","\u0924\u0947\u091C\u093C\u093E\u092C \u0939\u094B \u0924\u094B \u0915\u092E \u0938\u0947 \u0915\u092E 20 \u092E\u093F\u0928\u091F \u0916\u0942\u092C \u092C\u0939\u0924\u0947 \u092A\u093E\u0928\u0940 \u0938\u0947 \u0927\u094B\u090F\u0901\u0964"]}},pregnancy:{label:H("Pregnancy / labour emergency","\u0917\u0930\u094D\u092D\u093E\u0935\u0938\u094D\u0925\u093E / \u092A\u094D\u0930\u0938\u0935 \u0906\u092A\u093E\u0924\u0915\u093E\u0932"),icon:"\u{1F930}",base:"serious",golden:60,required:["emergency","obstetrics"],preferred:["nicu","blood_bank","icu"],keywords:[["pregnan",5],["labour",5],["labor pain",5],["delivery",4],["contraction",4],["water broke",5],["garbhvati",6],["garbhwati",6],["\u0917\u0930\u094D\u092D\u0935\u0924\u0940",6],["prasav",6],["\u092A\u094D\u0930\u0938\u0935",6],["\u0921\u093F\u0932\u0940\u0935\u0930\u0940",5],["\u092A\u0947\u091F \u0938\u0947",3],["pani toot",5],["\u092A\u093E\u0928\u0940 \u091F\u0942\u091F",5],["dard shuru",2],["bachcha hone",5],["\u092C\u091A\u094D\u091A\u093E \u0939\u094B\u0928\u0947",5]],firstAid:{en:["Let her lie on her LEFT side \u2013 this improves blood flow to the baby.","Carry her mother-child card / ANC card and any reports.","If the baby is being born: support the head gently, do not pull. Keep the baby warm, skin-to-skin.","Heavy bleeding, fits or severe headache are danger signs \u2013 tell the hospital immediately."],hi:["\u0909\u0928\u094D\u0939\u0947\u0902 \u092C\u093E\u0908\u0902 \u0915\u0930\u0935\u091F \u0932\u093F\u091F\u093E\u090F\u0901 \u2013 \u0907\u0938\u0938\u0947 \u092C\u091A\u094D\u091A\u0947 \u0924\u0915 \u0916\u0942\u0928 \u0915\u093E \u092A\u094D\u0930\u0935\u093E\u0939 \u092C\u0947\u0939\u0924\u0930 \u0939\u094B\u0924\u093E \u0939\u0948\u0964","\u092E\u093E\u0924\u0943-\u0936\u093F\u0936\u0941 \u0938\u0941\u0930\u0915\u094D\u0937\u093E \u0915\u093E\u0930\u094D\u0921 / ANC \u0915\u093E\u0930\u094D\u0921 \u0914\u0930 \u0930\u093F\u092A\u094B\u0930\u094D\u091F \u0938\u093E\u0925 \u0930\u0916\u0947\u0902\u0964","\u0905\u0917\u0930 \u092C\u091A\u094D\u091A\u093E \u092C\u093E\u0939\u0930 \u0906 \u0930\u0939\u093E \u0939\u094B: \u0938\u093F\u0930 \u0915\u094B \u0927\u0940\u0930\u0947 \u0938\u0947 \u0938\u0939\u093E\u0930\u093E \u0926\u0947\u0902, \u0916\u0940\u0902\u091A\u0947\u0902 \u0928\u0939\u0940\u0902\u0964 \u092C\u091A\u094D\u091A\u0947 \u0915\u094B \u0917\u0930\u094D\u092E \u0930\u0916\u0947\u0902, \u092E\u093E\u0901 \u0915\u0940 \u0924\u094D\u0935\u091A\u093E \u0938\u0947 \u0932\u0917\u093E\u090F\u0901\u0964","\u091C\u093C\u094D\u092F\u093E\u0926\u093E \u0916\u0942\u0928 \u092C\u0939\u0928\u093E, \u0926\u094C\u0930\u0947 \u092F\u093E \u0924\u0947\u091C\u093C \u0938\u093F\u0930\u0926\u0930\u094D\u0926 \u0916\u0924\u0930\u0947 \u0915\u0947 \u0938\u0902\u0915\u0947\u0924 \u0939\u0948\u0902 \u2013 \u0905\u0938\u094D\u092A\u0924\u093E\u0932 \u0915\u094B \u0924\u0941\u0930\u0902\u0924 \u092C\u0924\u093E\u090F\u0901\u0964"]}},snakebite:{label:H("Snake bite","\u0938\u093E\u0901\u092A \u0915\u093E \u0915\u093E\u091F\u0928\u093E"),icon:"\u{1F40D}",base:"critical",golden:120,required:["emergency","anti_venom"],preferred:["icu","ventilator","dialysis"],keywords:[["snake",6],["cobra",6],["krait",6],["viper",5],["saanp",6],["sanp",6],["saap",5],["\u0938\u093E\u0902\u092A",6],["\u0938\u093E\u0901\u092A",6],["\u0928\u093E\u0917",5],["naag",5],["\u0915\u0930\u0948\u0924",6]],firstAid:{en:["Keep the person completely still and calm \u2013 movement spreads venom faster.","Keep the bitten limb straight and below heart level; remove rings, bangles, tight clothes.","Do NOT cut, suck, apply ice or tie a tight tourniquet. Do not go to a jhaad-phoonk healer \u2013 anti-venom is the only cure.","Note the time of bite. A photo of the snake (from a safe distance) helps, but never try to catch it."],hi:["\u0935\u094D\u092F\u0915\u094D\u0924\u093F \u0915\u094B \u092C\u093F\u0932\u094D\u0915\u0941\u0932 \u0938\u094D\u0925\u093F\u0930 \u0914\u0930 \u0936\u093E\u0902\u0924 \u0930\u0916\u0947\u0902 \u2013 \u0939\u093F\u0932\u0928\u0947 \u0938\u0947 \u091C\u093C\u0939\u0930 \u0924\u0947\u091C\u093C\u0940 \u0938\u0947 \u092B\u0948\u0932\u0924\u093E \u0939\u0948\u0964","\u0915\u093E\u091F\u0947 \u0939\u0941\u090F \u0905\u0902\u0917 \u0915\u094B \u0938\u0940\u0927\u093E \u0914\u0930 \u0926\u093F\u0932 \u0938\u0947 \u0928\u0940\u091A\u0947 \u0930\u0916\u0947\u0902; \u0905\u0901\u0917\u0942\u0920\u0940, \u091A\u0942\u0921\u093C\u0940, \u0924\u0902\u0917 \u0915\u092A\u0921\u093C\u0947 \u0939\u091F\u093E\u090F\u0901\u0964","\u0915\u093E\u091F\u0947\u0902 \u0928\u0939\u0940\u0902, \u091A\u0942\u0938\u0947\u0902 \u0928\u0939\u0940\u0902, \u092C\u0930\u094D\u092B\u093C \u0928 \u0932\u0917\u093E\u090F\u0901, \u0915\u0938\u0915\u0930 \u092A\u091F\u094D\u091F\u0940 \u0928 \u092C\u093E\u0901\u0927\u0947\u0902\u0964 \u091D\u093E\u0921\u093C-\u092B\u0942\u0901\u0915 \u092E\u0947\u0902 \u0938\u092E\u092F \u0928 \u0917\u0901\u0935\u093E\u090F\u0901 \u2013 \u090F\u0902\u091F\u0940-\u0935\u0947\u0928\u092E \u0939\u0940 \u0907\u0932\u093E\u091C \u0939\u0948\u0964","\u0915\u093E\u091F\u0928\u0947 \u0915\u093E \u0938\u092E\u092F \u0928\u094B\u091F \u0915\u0930\u0947\u0902\u0964 \u0938\u0941\u0930\u0915\u094D\u0937\u093F\u0924 \u0926\u0942\u0930\u0940 \u0938\u0947 \u0938\u093E\u0901\u092A \u0915\u0940 \u092B\u093C\u094B\u091F\u094B \u092E\u0926\u0926 \u0915\u0930\u092 <script>
(function () {
  var citizen = document.getElementById('citizen');
  var desk = document.getElementById('desk');
  var staffed = document.getElementById('staffed');
  var narrow = window.matchMedia('(max-width: 900px)');
  staffed.checked = !narrow.matches; // on big screens, you play the hospital desk
  citizen.srcdoc = window.__TPL.citizen;
  desk.srcdoc = window.__TPL.hospital;

  function show(which) {
    document.getElementById('paneCitizen').classList.toggle('hidden-mobile', which !== 'citizen');
    document.getElementById('paneDesk').classList.toggle('hidden-mobile', which !== 'desk');
    document.getElementById('tabCitizen').setAttribute('aria-selected', String(which === 'citizen'));
    document.getElementById('tabDesk').setAttribute('aria-selected', String(which === 'desk'));
  }
  document.getElementById('tabCitizen').onclick = function () { show('citizen'); };
  document.getElementById('tabDesk').onclick = function () { show('desk'); };
  show('citizen');

  var toastTimer;
  function toast(text) {
    document.getElementById('toastText').textContent = text;
    var t = document.getElementById('toast');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 9000);
  }
  document.getElementById('toastBtn').onclick = function () { show('desk'); document.getElementById('toast').classList.remove('show'); };

  var server = window.sehatServer;
  // "Staffed" mode: log the console in as the requested hospital's Emergency
  // Desk Officer (real OTP flow, demo OTP), so the referral waits for YOU.
  server.hooks.beforeRequest = async function (hospitalId) {
    if (!staffed.checked) return;
    var consoleApi = desk.contentWindow && desk.contentWindow.sehatConsole;
    if (!consoleApi) return;
    try { await consoleApi.demoLogin(hospitalId, 'ED01'); } catch (e) { return; }
    for (var i = 0; i < 40 && server.store.listeners('hospital:' + hospitalId) === 0; i++) {
      await new Promise(function (r) { setTimeout(r, 50); });
    }
  };
  server.hooks.afterRequest = function (hospitalId, waitingForHuman) {
    // On wide screens the console is visible and shows its own alert.
    if (!waitingForHuman || !narrow.matches) return;
    var h = server.store.getHospital(hospitalId);
    toast('🔔 ' + h.name + ' received the referral – you are logged in as its Emergency Desk Officer: accept it in the console');
  };
})();
</script>

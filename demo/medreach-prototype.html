* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }

.tabs button[aria-selected="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.stage { flex: 1; display: grid; grid-template-columns: 420px 1fr; gap: 1rem; padding: 1rem; min-height: 0; }
.pane { display: flex; flex-direction: column; min-height: 0; }
.pane h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 .5rem; }
.phone { flex: 1; border: 10px solid var(--phone); border-radius: 36px; overflow: hidden; background: #fff; box-shadow: 0 20px 50px rgba(15,27,45,.25); max-height: 880px; min-height: 0; }
.desk { flex: 1; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); min-height: 0; }
iframe { width: 100%; height: 100%; border: 0; display: block; }
.toast { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%) translateY(150%); background: var(--ink); color: var(--bg); padding: .75rem 1rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.3); display: flex; gap: .75rem; align-items: center; transition: transform .25s; max-width: calc(100% - 2rem); z-index: 10; }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast button { border: 0; background: var(--sos); color: #fff; border-radius: 8px; padding: .4rem .7rem; font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap; }
@media (min-width: 901px) { .toast button { display: none; } }
@media (max-width: 900px) {
  .tabs { display: flex; }
  .stage { grid-template-columns: 1fr; padding: .5rem 0 0; }
  .pane h2 { display: none; }
  .pane.hidden-mobile { display: none; }
  .phone { border: 0; border-radius: 0; box-shadow: none; max-height: none; }
  .desk { border: 0; border-radius: 0; }
}

r LEFT side \u2013 this improves blood flow to the baby.","Carry her mother-child card / ANC card and any reports.","If the baby is being born: support the head gently, do not pull. Keep the baby warm, skin-to-skin.","Heavy bleeding, fits or severe headache are danger signs \u2013 tell the hospital immediately."],hi:["\u0909\u0928\u094D\u0939\u0947\u0902 \u092C\u093E\u0908\u0902 \u0915\u0930\u0935\u091F \u0932\u093F\u091F\u093E\u090F\u0901 \u2013 \u0907\u0938\u0938\u0947 \u092C\u091A\u094D\u091A\u0947 \u0924\u0915 \u0916\u0942\u0928 \u0915\u093E \u092A\u094D\u0930\u0935\u093E\u0939 \u092C\u0947\u0939\u0924\u0930 \u0939\u094B\u0924\u093E \u0939\u0948\u0964","\u092E\u093E\u0924\u0943-\u0936\u093F\u0936\u0941 \u0938\u0941\u0930\u0915\u094D\u0937\u093E \u0915\u093E\u0930\u094D\u0921 / ANC \u0915\u093E\u0930\u094D\u0921 \u0914\u0930 \u0930\u093F\u092A\u094B\u0930\u094D\u091F \u0938\u093E\u0925 \u0930\u0916\u0947\u0902\u0964","\u0905\u0917\u0930 \u092C\u091A\u094D\u091A\u093E \u092C\u093E\u0939\u0930 \u0906 \u0930\u0939\u093E \u0939\u094B: \u0938\u093F\u0930 \u0915\u094B \u0927\u0940\u0930\u0947 \u0938\u0947 \u0938\u0939\u093E\u0930\u093E \u0926\u0947\u0902, \u0916\u0940\u0902\u091A\u0947\u0902 \u0928\u0939\u0940\u0902\u0964 \u092C\u091A\u094D\u091A\u0947 \u0915\u094B \u0917\u0930\u094D\u092E \u0930\u0916\u0947\u0902, \u092E\u093E\u0901 \u0915\u0940 \u0924\u094D\u0935\u091A\u093E \u0938\u0947 \u0932\u0917\u093E\u090F\u0901\u0964","\u091C\u093C\u094D\u092F\u093E\u0926\u093E \u0916\u0942\u0928 \u092C\u0939\u0928\u093E, \u0926\u094C\u0930\u0947 \u092F\u093E \u0924\u0947\u091C\u093C \u0938\u093F\u0930\u0926\u0930\u094D\u0926 \u0916\u0924\u0930\u0947 \u0915\u0947 \u0938\u0902\u0915\u0947\u0924 \u0939\u0948\u0902 \u2013 \u0905\u0938\u094D\u092A\u0924\u093E\u0932 \u0915\u094B \u0924\u0941\u0930\u0902\u0924 \u092C\u0924\u093E\u090F\u0901\u0964"]}},snakebite:{label:A("Snake bite","\u0938\u093E\u0901\u092A \u0915\u093E \u0915\u093E\u091F\u0928\u093E"),icon:"\u{1F40D}",base:"critical",golden:120,required:["emergency","anti_venom"],preferred:["icu","ventilator","dialysis"],keywords:[["snake",6],["cobra",6],["krait",6],["viper",5],["saanp",6],["sanp",6],["saap",5],["\u0938\u093E\u0902\u092A",6],["\u0938\u093E\u0901\u092A",6],["\u0928\u093E\u0917",5],["naag",5],["\u0915\u0930\u0948\u0924",6]],firstAid:{en:["Keep the person completely still and calm \u2013 movement spreads venom faster.","Keep the bitten limb straight and below heart level; remove rings, bangles, tight clothes.","Do NOT cut, suck, apply ice or tie a tight tourniquet. Do not go to a jhaad-phoonk healer \u2013 anti-venom is the only cure.","Note the time of bite. A photo of the snake (from a safe distance) helps, but never try to catch it."],hi:["\u0935\u094D\u092F\u0915\u094D\u0924\u093F \u0915\u094B \u092C\u093F\u0932\u094D\u0915\u0941\u0932 \u0938\u094D\u0925\u093F\u0930 \u0914\u0930 \u0936\u093E\u0902\u0924 \u0930\u0916\u0947\u0902 \u2013 \u0939\u093F\u0932\u0928\u0947 \u0938\u0947 \u091C\u093C\u0939\u0930 \u0924\u0947\u091C\u093C\u0940 \u0938\u0947 \u092B\u0948\u0932\u0924\u093E \u0939\u0948\u0964","\u0915\u093E\u091F\u0947 \u0939\u0941\u090F \u0905\u0902\u0917 \u0915\u094B \u0938\u0940\u0927\u093E \u0914\u0930 \u0926\u093F\u0932 \u0938\u0947 \u0928\u0940\u091A\u0947 \u0930\u0916\u0947\u0902; \u0905\u0901\u0917\u0942\u0920\u0940, \u091A\u0942\u0921\u093C\u0940, \u0924\u0902\u0917 \u0915\u092A\u0921\u093C\u0947 \u0939\u091F\u093E\u090F\u0901\u0964","\u0915\u093E\u091F\u0947\u0902 \u0928\u0939\u0940\u0902, \u091A\u0942\u0938\u0947\u0902 \u0928\u0939\u0940\u0902, \u092C\u0930\u094D\u092B\u093C \u0928 \u0932\u0917\u093E\u090F\u0901, \u0915\u0938\u0915\u0930 \u092A\u091F\u094D\u091F\u0940 \u0928 \u092C\u093E\u0901\u0927\u0947\u0902\u0964 \u091D\u093E\u0921\u093C-\u092B\u0942\u0901\u0915 \u092E\u0947\u0902 \u0938\u092E\u092F \u0928 \u0917\u0901\u0935\u093E\u090F\u0901 \u2013 \u090F\u0902\u091F\u0940-\u0935\u0947\u0928\u092E \u0939\u0940 \u0907\u0932\u093E\u091C \u0939\u0948\u0964","\u0915\u093E\u091F\u0928\u0947 \u0915\u093E \u0938\u092E\u092F \u0928\u094B\u091F \u0915\u0930\u0947\u0902\u0964 \u0938\u0941\u0930\u0915\u094D\u0937\u093F\u0924 \u0926\u0942\u0930\u0940 \u0938\u0947 \u0938\u093E\u0901\u092A \u0915\u0940 \u092B\u093C\u094B\u091F\u094B \u092E\u0926\u0926 \u0915\u0930\u0924\u0940 \u0939\u0948, \u092A\u0915\u0921\u093C\u0928\u0947 \u0915\u0940 \u0915\u094B\u0936\u093F\u0936 \u0928 \u0915\u0930\u0947\u0902\u0964"]}},poisoning:{label:A("Poisoning / pesticide / overdose","\u091C\u093C\u0939\u0930 / \u0915\u0940\u091F\u0928\u093E\u0936\u0915 / \u0913\u0935\u0930\u0921\u094B\u091C\u093C"),icon:"\u2620\uFE0F",base:"critical",golden:60,required:["emergency","icu"],preferred:["toxicology","ventilator","dialysis"],keywords:[["poison",6],["pesticide",6],["insecticide",6],["overdose",6],["sulphas",6],["kerosene",4],["phenyl",4],["zeher",6],["zehar",6],["jahar",6],["\u091C\u0939\u0930",6],["\u091C\u093C\u0939\u0930",6],["keetnashak",6],["\u0915\u0940\u091F\u0928\u093E\u0936\u0915",6],["dawai kha",3],["gas leak",4]],firstAid:{en:["Do NOT make the person vomit and do not give milk, salt water or oil.","If they are drowsy, lay them on their side (recovery position) so they do not choke.","Take the poison bottle / pesticide packet / medicine strip with you to the hospital.","If poison is on skin or clothes (farm spray), remove clothes and wash skin with soap and water."],hi:["\u0909\u0932\u094D\u091F\u0940 \u0928 \u0915\u0930\u0935\u093E\u090F\u0901, \u0914\u0930 \u0926\u0942\u0927, \u0928\u092E\u0915 \u0915\u093E \u092A\u093E\u0928\u0940 \u092F\u093E \u0924\u0947\u0932 \u0928 \u092A\u093F\u0932\u093E\u090F\u0901\u0964","\u0905\u0917\u0930 \u0935\u094D\u092F\u0915\u094D\u0924\u093F \u0938\u0941\u0938\u094D\u0924 \u0939\u0948, \u0924\u094B \u0915\u0930\u0935\u091F \u0938\u0947 \u0932\u093F\u091F\u093E\u090F\u0901 (\u0930\u093F\u0915\u0935\u0930\u0940 \u092A\u094B\u091C\u093C\u093F\u0936\u0928) \u0924\u093E\u0915\u093F \u0926\u092E \u0928 \u0918\u0941\u0 \n.attach {\n  border: 1px dashed var(--line); border-radius: 12px; padding: .75rem; cursor: pointer; background: var(--surface-2);\n  display: flex; flex-direction: column; gap: .2rem; text-align: left;\n}\n.attach strong { font-size: .95rem; }\n.attach span { font-size: .8rem; color: var(--muted); }\n.attach.done { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }\n.thumb { max-width: 100%; max-height: 160px; border-radius: 10px; display: block; margin-top: .5rem; }\n\n/* ---------- Step 2: AI understanding ---------- */\n.sev { display: inline-flex; align-items: center; gap: .35rem; font-weight: 700; border-radius: 999px; padding: .2rem .7rem; font-size: .85rem; color: #fff; }\n.sev.critical { background: var(--critical); }\n.sev.serious { background: var(--serious); }\n.sev.moderate { background: var(--moderate); }\n.engine-badge { font-size: .75rem; border: 1px solid var(--line); border-radius: 999px; padding: .1rem .55rem; color: var(--muted); }\n.cap-list { display: flex; flex-wrap: wrap; gap: .35rem; }\n.cap { font-size: .8rem; border-radius: 8px; padding: .15rem .5rem; background: var(--surface-2); border: 1px solid var(--line); }\n.cap.ok { background: var(--ok-soft); border-color: transparent; }\n.cap.no { background: var(--sos-soft); border-color: transparent; text-decoration: line-through; }\n.cap.off { background: var(--warn-soft); border-color: transparent; }\n.firstaid { counter-reset: fa; padding: 0; margin: 0; }\n.firstaid li { list-style: none; counter-increment: fa; position: relative; padding: .45rem 0 .45rem 2.2rem; border-bottom: 1px dashed var(--line); }\n.firstaid li:last-child { border-bottom: 0; }\n.firstaid li::before {\n  content: counter(fa); position: absolute; left: 0; top: .45rem; width: 1.6rem; height: 1.6rem; border-radius: 50%;\n  background: var(--sos-soft); color: var(--sos); font-weight: 700; display: grid; place-items: center; font-size: .85rem;\n}\n.redflag { color: var(--critical); font-weight: 600; <script>
(function () {
  var citizen = document.getElementById('citizen');

  function show(which) {

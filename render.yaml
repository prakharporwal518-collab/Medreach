# Render Blueprint – https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repo. Render asks for GEMINI_API_KEY / ANTHROPIC_API_KEY (both optional) and SEHAT_DATA_KEY.
services:
  - type: web
    name: sehat-setu
    runtime: node
    plan: free
    region: singapore          # closest Render region to India
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 'demo' = simulated hospital data, OTP shown on screen (no SMS gateway).
      # Keep 'demo' for the hackathon: in 'live' mode the OTP is never shown, so nobody can log in without an SMS gateway.
      - key: SEHAT_DATA_MODE
        value: demo
      - key: SEHAT_DEMO_SPEED
        value: "15"
      - key: SEHAT_SIM_RESPONSE_MS
        value: "3500"
      - key: SEHAT_RESPONSE_TIMEOUT_MS
        value: "60000"
      - key: SEHAT_RETENTION_MS
        value: "86400000"
      - key: SEHAT_AI_TIMEOUT_MS
        value: "15000"
      # Optional Generative AI. Set in the Render dashboard (secret), never commit it.
      # Gemini: free key from https://aistudio.google.com/apikey
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ANTHROPIC_API_KEY
        sync: false
      # Only needed when BOTH keys are set: 'gemini' or 'claude'.
      - key: SEHAT_AI_PROVIDER
        sync: false
      # 64 hex chars (openssl rand -hex 32). Encrypts patient details in memory (AES-256-GCM).
      # Optional: without it a random key is made at every start.
      - key: SEHAT_DATA_KEY
        sync: false
      # 108 / 102 control room (CAD) – only when the state's 108 operator provides an endpoint.
      - key: SEHAT_EMS_URL
        sync: false
      - key: SEHAT_EMS_SECRET
        sync: false
      # Emergency by SMS for areas without mobile data (needs an Indian SMS gateway, DLT-registered).
      - key: SEHAT_SMS_NUMBER
        sync: false
      - key: SEHAT_SMS_SECRET
        sync: false
      - key: SEHAT_SMS_SEND_URL
        sync: false
      - key: SEHAT_SMS_SEND_TOKEN
        sync: false
      # Real road routes from the public OSRM server (OpenStreetMap). 'off' = straight lines.
      - key: SEHAT_ROUTING
        value: "on"

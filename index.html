  <script type="text/babel" data-presets="react">
  /* =====================================================================
     SEHAT SETU (सेहत सेतु) — "A bridge to health"
     Hackathon prototype: ASHA co-pilot app + District (CMHO) dashboard.
     Everything lives in memory. The AI only FLAGS RISK and REFERS.

  const { useState, useEffect, useRef, useMemo, useReducer, useContext, createContext, useCallback } = React;

  /* ---------------------------------------------------------------------
     1. SMALL HELPERS
     --------------------------------------------------------------------- */
  const MIN = 60 * 1000, HOUR = 60 * MIN, DAY = 24 * HOUR;
  const startOfDay = (ts = Date.now()) => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const TODAY = startOfDay();
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sum = (arr) => arr.reduce((a, b) => a + b, 0);
  let _uid = 0;
  const uid = (p) => `${p}-${Date.now().toString(36)}-${(++_uid).toString(36)}`;

  /** Deterministic 32-bit hash for strings (used for QR patterns, jitter, mock picks). */
  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  /** Small seeded random generator. */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  /** Great-circle distance in km. */
  function haversineKm(a, b) {
    const R = 6371, toR = (x) => (x * Math.PI) / 180;
    const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  /** Approximate road distance (straight line x 1.35 for rural roads). */
  const roadKm = (a, b) => Math.round(haversineKm(a, b) * 1.35);

  /** Pick the English or Hindi half of a [en, hi] pair. */
  const pick = (pair, lang) => (Array.isArray(pair) ? (lang === 'hi' ? pair[1] : pair[0]) : pair);

  const toISODate = (ts) => {
    const d = new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  const fromISODate = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1).getTime(); };
  const locale = (lang) => (lang === 'hi' ? 'hi-IN' : 'en-IN');
  const fmtDate = (ts, lang) => new Date(ts).toLocaleDateString(locale(lang), { day: 'numeric', month: 'short' });
  const fmtDateLong = (ts, lang) => new Date(ts).toLocaleDateString(locale(lang), { weekday: 'long', day: 'numeric', month: 'long' });
  const fmtTime = (ts, lang) => new Date(ts).toLocaleTimeString(locale(lang), { hour: '2-digit', minute: '2-digit' });

  /** "12 min", "2h 5m", "3 d" (bilingual). */
  function timeAgo(ts, now, lang) {
    const m = Math.max(0, Math.round((now - ts) / MIN));
    const hi = lang === 'hi';
    if (m < 1) return hi ? 'अभी' : 'just now';
    if (m < 60) return hi ? `${m} मिनट` : `${m} min`;
    const h = Math.floor(m / 60);
    if (h < 24) return hi ? `${h} घं ${m % 60} मि` : `${h}h ${m % 60}m`;
    const d = Math.floor(h / 24);
    return hi ? `${d} दिन` : `${d} d`;
  }
  /** "Today", "Tomorrow", "2 days overdue", or a date. */
  function dayLabel(ts, lang) {
    const diff = Math.round((startOfDay(ts) - startOfDay()) / DAY);
    const hi = lang === 'hi';
    if (diff === 0) return hi ? 'आज' : 'Today';
    if (diff === 1) return hi ? 'कल' : 'Tomorrow';
    if (diff < 0) return hi ? `${-diff} दिन देर` : `${-diff} d overdue`;
    return fmtDate(ts, lang);
  }
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------------------------------------------------------------------
     2. MOCK DATA — Shahdol district, 5 blocks, 15 villages, 6 facilities,

     --------------------------------------------------------------------- */
  const BLOCKS = [
    { id: 'sohagpur', name: ['Sohagpur', 'सोहागपुर'], lat: 23.30, lng: 81.36 },
    { id: 'burhar', name: ['Burhar', 'बुढ़ार'], lat: 23.20, lng: 81.53 },
    { id: 'gohparu', name: ['Gohparu', 'गोहपारू'], lat: 23.38, lng: 81.70 },

  const FACILITIES = [
    { id: 'dh', name: ['District Hospital, Shahdol', 'जिला चिकित्सालय, शहडोल'], type: 'DH', fru: true, block: 'sohagpur', lat: 23.297, lng: 81.358 },

    ['kanchanpur', 'Kanchanpur', 'कंचनपुर', 'sohagpur', 23.35, 81.27],

  /** Nearest facility matching a filter, with road distance. */
  function nearestFacility(pt, filter = () => true) {
    let best = null;
    FACILITIES.filter(filter).forEach((f) => {
      const d = roadKm(pt, f);
      if (!best || d < best.km) best = { f, km: d };
    });

  }

  const VILLAGES = RAW_VILLAGES.map(([id, en, hi, block, lat, lng]) => {
    const v = { id, name: [en, hi], block, lat, lng };
    const fru = nearestFacility(v, (f) => f.fru);
    return { ...v, fruId: fru.f.id, fruKm: fru.km };
  });
  const VILLAGE_BY_ID = Object.fromEntries(VILLAGES.map((v) => [v.id, v]));

  const ASHAS = [
    { id: 'A1', name: 'Sunita Baiga', hiName: 'सुनीता बैगा', villages: ['kudri', 'pondi'], block: 'gohparu', visits: 142, flagged: 11 },

    { id: 'A3', name: 'Meera Gond', hiName: 'मीरा गोंड', villages: ['amlaitola', 'kanchanpur'], block: 'sohagpur', visits: 131, flagged: 8 },
    { id: 'A4', name: 'Rukmini Singh', hiName: 'रुक्मिणी सिंह', villages: ['bhamra'], block: 'sohagpur', visits: 97, flagged: 5 },

    // Kamla Kol (A2): Chhatwai

  /**
   * High-risk pregnancy score (0–100) with an explanation of every factor.
   * Bleeding, convulsions, severe headache/blurred vision or BP ≥160/110 → automatic RED.
   */
  function scorePregnancy(f) {
    const F = [];
    const add = (key, pts, en, hi, red = false) => F.push({ key, pts, label: [en, hi], red });
    const age = Number(f.age);
    if (age > 0 && age < 18) add('age', 10, `Age ${age} (below 18)`, `उम्र ${age} (18 से कम)`);
    else if (age > 35) add('age', 10, `Age ${age} (above 35)`, `उम्र ${age} (35 से अधिक)`);

    const hb = parseFloat(f.hb);
    if (hb > 0) {
      if (hb < 7) add('hb', 30, `Hb ${hb} g/dL — severe anaemia`, `Hb ${hb} — गंभीर एनीमिया`);
      else if (hb < 9) add('hb', 18, `Hb ${hb} g/dL — moderate anaemia`, `Hb ${hb} — मध्यम एनीमिया`);
      else if (hb < 11) add('hb', 10, `Hb ${hb} g/dL — mild anaemia`, `Hb ${hb} — हल्का एनीमिया`);
    }
    const s = Number(f.bpS), d = Number(f.bpD);
    if (s >= 160 || d >= 110) add('bp', 30, `BP ${s}/${d} — very high BP`, `बीपी ${s}/${d} — बहुत ज़्यादा`, true);
    else if (s >= 140 || d >= 90) add('bp', 22, `BP ${s}/${d} — high BP (≥140/90)`, `बीपी ${s}/${d} — हाई बीपी (≥140/90)`);

    const g = Number(f.gravida);
    if (g >= 3) add('gravida', 6, `${g} previous pregnancies`, `${g} पिछली गर्भावस्थाएँ`);
    if (f.prevCS) add('cs', 10, 'Previous C-section', 'पिछला सिज़ेरियन ऑपरेशन');
    if (f.swelling) add('swelling', 8, 'Swelling of feet / face', 'पैर / चेहरे पर सूजन');
    if (f.headache) add('headache', 25, 'Severe headache / blurred vision', 'तेज़ सिरदर्द / धुंधला दिखना', true);
    if (f.bleeding) add('bleeding', 35, 'Bleeding', 'खून आना (रक्तस्राव)', true);
    if (f.convulsions) add('convulsions', 40, 'Convulsions / fits', 'दौरे / झटके', true);
    if (f.lessMove) add('movement', 18, 'Reduced baby movement', 'शिशु की हलचल कम');
    if (f.sickle === 'disease') add('sickle', 15, 'Sickle cell disease', 'सिकल सेल रोग');
    else if (f.sickle === 'trait') add('sickle', 5, 'Sickle cell trait', 'सिकल सेल वाहक (ट्रेट)');

    const dist = Number(f.distance);
    if (dist > 40) add('distance', 12, `${dist} km to nearest FRU`, `नज़दीकी FRU ${dist} किमी दूर`);
    else if (dist > 20) add('distance', 8, `${dist} km to nearest FRU`, `नज़दीकी FRU ${dist} किमी दूर`);

    const score = Math.min(100, sum(F.map((x) => x.pts)));
    const autoRed = F.some((x) => x.red);
    const band = autoRed || score >= 45 ? 'RED' : score >= 20 ? 'YELLOW' : 'GREEN';
    return { score, band, autoRed, factors: F };
  }

  /** Short "condition" headline for a pregnancy score result. */
  function conditionFromScore(r) {
    const has = (k) => r.factors.some((x) => x.key === k);
    if (has('bleeding')) return ['Bleeding in pregnancy — emergency', 'गर्भावस्था में रक्तस्राव — आपात स्थिति'];
    if (has('convulsions')) return ['Possible eclampsia (fits)', 'एक्लेम्पसिया (दौरे) की आशंका'];
    if (has('bp') && (has('headache') || has('swelling'))) return ['Possible pre-eclampsia risk', 'प्री-एक्लेम्पसिया का संभावित खतरा'];

    return [`High-risk pregnancy (score ${r.score}/100)`, `उच्च जोखिम गर्भावस्था (स्कोर ${r.score}/100)`];
  }

  /** Approximate WHO median weight-for-age (kg) for 0–60 months. */
  function medianWeight(m) {
    if (m <= 12) return 3.3 + m * 0.525;
    if (m <= 24) return 9.6 + (m - 12) * 0.217;
    return 12.2 + (m - 24) * 0.175;
  }

  /** Risk band + reasons for any patient record. */

      return { risk: r.band, score: r.score, reasons: r.factors.map((x) => x.label) };
    }
    if (p.type === 'child') {
      const ratio = p.weight / medianWeight(p.ageM || 12);
      if (ratio < 0.7) return { risk: 'RED', reasons: [[`Weight ${p.weight} kg — severely underweight for age`, `वज़न ${p.weight} किग्रा — उम्र के हिसाब से बहुत कम`]] };
      if (ratio < 0.8) return { risk: 'YELLOW', reasons: [[`Weight ${p.weight} kg — underweight for age`, `वज़न ${p.weight} किग्रा — उम्र के हिसाब से कम`]] };
      return { risk: 'GREEN', reasons: [['Growth normal for age', 'उम्र के अनुसार विकास सामान्य']] };
    }
    // Sickle cell patients
    const reasons = [];
    if (p.sickle === 'disease') reasons.push(['Sickle cell disease', 'सिकल सेल रोग']);
    if (p.sickle === 'trait') reasons.push(['Sickle cell trait', 'सिकल सेल वाहक']);
    if (p.hb < 7) return { risk: 'RED', reasons: [...reasons, [`Hb ${p.hb} — severe anaemia`, `Hb ${p.hb} — गंभीर एनीमिया`]] };
    if (p.sickle === 'disease' || p.hb < 9) return { risk: 'YELLOW', reasons: [...reasons, [`Hb ${p.hb} g/dL`, `Hb ${p.hb} g/dL`]] };
    return { risk: 'GREEN', reasons };
  }

  const UNIT_RE = '(?=\\s*(?:mahine|mahina|maheene|month|months|saal|sal|year|years|din|day|days|महीने|महीना|माह|साल|वर्ष|दिन))';

  /** Detect symptoms, context and numbers (month, age, days, BP) from free text. */
  function analyzeText(raw) {
    let t = ' ' + String(raw).toLowerCase().replace(/[०-९]/g, (d) => '०१२३४५६७८९'.indexOf(d)) + ' ';
    // Normalise tricky phrases before keyword matching
    t = t.replace(/khoon ki kami|khun ki kami|खून की कमी/g, ' anaemia ')
      .replace(/blood pressure/g, ' bp ')
      .replace(/patla paikhana|patli tatti|पतला पैखाना/g, ' dast ');
    Object.entries(NUM_WORDS).forEach(([w, n]) => { t = t.replace(new RegExp('(^|\\s)' + w + UNIT_RE, 'g'), `$1${n}`); });

    const ids = new Set(SYMPTOMS.filter((s) => s.tests.some((fn) => fn(t))).map((s) => s.id));
    if (ids.has('highfever')) ids.delete('fever');
    const month = (t.match(/(\d{1,2})\s*(?:st|nd|rd|th)?\s*(?:mahine|mahina|maheene|month|months|महीने|महीना|माह)/) || [])[1];
    const years = (t.match(/(\d{1,2})\s*(?:saal|sal|year|years|yr|yrs|साल|वर्ष)/) || [])[1];
    const days = (t.match(/(\d{1,2})\s*(?:din|dino|day|days|दिन)/) || [])[1];
    const bp = t.match(/(\d{2,3})\s*\/\s*(\d{2,3})/);

    let context = 'general';
    if (ids.has('pregnant')) context = 'maternal';
    else if (ids.has('child')) context = 'child';
    else if (ids.has('sickle')) context = 'sickle';
    else if (ids.has('fever') || ids.has('highfever')) context = 'fever';

    return {
      ids, context,
      found: [...ids].filter((id) => !SYMPTOM_BY_ID[id].context || id === 'sickle').map((id) => SYMPTOM_BY_ID[id]),
      month: month ? Number(month) : null,
      years: years ? Number(years) : null,
      days: days ? Number(days) : null,
      bp: bp ? [Number(bp[1]), Number(bp[2])] : null,
    };
  }

    drink: { id: 'drink', type: 'yesno', q: ['Is the child able to drink or breastfeed?', 'क्या बच्चा पानी / माँ का दूध पी पा रहा है?'] },
    lethargic: { id: 'lethargic', type: 'yesno', q: ['Is the child very sleepy, or are the eyes sunken?', 'क्या बच्चा बहुत सुस्त है या आँखें धँसी हुई हैं?'] },
    muac: { id: 'muac', type: 'choice', q: ['What colour does the MUAC arm tape show?', 'MUAC (बाँह नापने की पट्टी) किस रंग पर है?'],
      options: [{ v: 'red', l: ['Red', 'लाल'], c: 'bg-red-600 text-white' }, { v: 'yellow', l: ['Yellow', 'पीला'], c: 'bg-amber-400 text-amber-950' }, { v: 'green', l: ['Green', 'हरा'], c: 'bg-emerald-600 text-white' }] },
    temp: { id: 'temp', type: 'number', min: 94, max: 108, step: '0.1', placeholder: '103', unit: ['°F', '°F'], q: ['What is the temperature in °F? (e.g. 103)', 'बुखार कितना है (°F में)? जैसे 103'] },
    chest: { id: 'chest', type: 'yesno', q: ['Any chest pain or difficulty in breathing?', 'क्या सीने में दर्द या साँस लेने में तकलीफ है?'] },
    pale: { id: 'pale', type: 'yesno', q: ['Are the eyes, palms or nails very pale or yellow?', 'क्या आँखें, हथेली या नाखून बहुत सफ़ेद / पीले हैं?'] },
    days: { id: 'days', type: 'number', min: 0, max: 90, step: '1', placeholder: '3', unit: ['days', 'दिन'], q: ['Since how many days?', 'कितने दिनों से?'] },
    eat: { id: 'eat', type: 'yesno', q: ['Is the person unable to eat / drink, or unconscious?', 'क्या व्यक्ति कुछ खा-पी नहीं पा रहा या बेहोश है?'] },
  };

  function buildQuestions(an) {
    const Q = QUESTIONS;
    const has = (id) => an.ids.has(id);
    let list = [];
    if (an.context === 'maternal') {
      list = [!an.bp && Q.bp, !has('bleeding') && Q.bleeding, (an.month == null || an.month >= 5) && !has('lessmovement') ? Q.movement : Q.vision];
    } else if (an.context === 'child') {
      list = [Q.drink, Q.lethargic, Q.muac];
    } else if (an.context === 'sickle') {
      list = [Q.temp, Q.chest, Q.pale];
    } else if (an.context === 'fever') {
      list = [Q.temp, an.days == null && Q.days, Q.chest];
    } else {
      list = [an.days == null && Q.days, Q.eat, Q.temp];
    }
    return list.filter(Boolean).slice(0, 3);
  }

  /**
   * Evaluate the conversation into a GREEN / YELLOW / RED flag.
   * Returns danger signs, a plain-language reason and the recommended action.
   * NOTE: flags risk only — never a diagnosis.
   */
  function evaluateVoice(an, ans) {
    const has = (id) => an.ids.has(id);
    const signs = an.found.map((s) => s.label);
    const addSign = (en, hi) => signs.push([en, hi]);
    const patientUpdates = {};
    let level = 'GREEN', condition = null, reason, action;

    if (an.context === 'maternal') {
      const bp = ans.bp || an.bp;
      const bpHigh = bp && (bp[0] >= 140 || bp[1] >= 90);
      const bpSevere = bp && (bp[0] >= 160 || bp[1] >= 110);
      if (bp) { patientUpdates.bp = bp; if (bpHigh) addSign(`High BP ${bp[0]}/${bp[1]}`, `हाई बीपी ${bp[0]}/${bp[1]}`); }
      const bleeding = has('bleeding') || ans.bleeding === true;
      const fits = has('convulsion');
      const blurred = has('blurred') || ans.vision === true;
      const lessMove = has('lessmovement') || ans.movement === true;
      const headache = has('headache'), swelling = has('swelling');
      if (ans.bleeding === true) addSign('Bleeding reported', 'खून आने की शिकायत');
      if (ans.movement === true) addSign('Reduced baby movement', 'शिशु की हलचल कम');
      if (ans.vision === true) addSign('Blurred vision / fits', 'धुंधला दिखना / दौरे');
      if (headache) patientUpdates.headache = true;
      if (swelling) patientUpdates.swelling = true;
      if (bleeding) patientUpdates.bleeding = true;
      if (lessMove) patientUpdates.lessMove = true;
      const monthTxt = an.month ? [`in the ${an.month}th month of pregnancy`, `गर्भावस्था के ${an.month}वें महीने में`] : ['during pregnancy', 'गर्भावस्था में'];

      if (bleeding || fits || blurred || lessMove || bpSevere || (bpHigh && (headache || swelling))) {
        level = 'RED';
        if (bleeding) {
          condition = ['Possible bleeding in pregnancy (APH) risk', 'गर्भावस्था में रक्तस्राव (APH) का खतरा'];
          reason = [`Bleeding ${monthTxt[0]} is a danger sign. It can quickly become life-threatening for mother and baby.`,
            `${monthTxt[1]} खून आना खतरे का संकेत है। यह माँ और बच्चे के लिए जल्दी जानलेवा हो सकता है।`];
        } else if (fits || blurred) {
          condition = ['Possible eclampsia risk', 'एक्लेम्पसिया का संभावित खतरा'];
          reason = ['Fits or blurred vision in pregnancy can mean eclampsia — a medical emergency.', 'गर्भावस्था में दौरे या धुंधला दिखना एक्लेम्पसिया हो सकता है — यह आपात स्थिति है।'];
        } else if (bpHigh) {
          condition = ['Possible pre-eclampsia risk', 'प्री-एक्लेम्पसिया का संभावित खतरा'];
          const bits = [headache && ['headache', 'सिर दर्द'], swelling && ['swelling in feet', 'पैरों में सूजन']].filter(Boolean);
          reason = [`BP is ${bp[0]}/${bp[1]} (above 140/90)${bits.length ? ' with ' + bits.map((b) => b[0]).join(' and ') : ''} ${monthTxt[0]}. Together these are warning signs of pre-eclampsia, which can lead to fits and harm mother and baby.`,
            `${monthTxt[1]} बीपी ${bp[0]}/${bp[1]} है (140/90 से ज़्यादा)${bits.length ? ', साथ में ' + bits.map((b) => b[1]).join(' और ') : ''}। ये सब मिलकर प्री-एक्लेम्पसिया के चेतावनी संकेत हैं, जिससे दौरे पड़ सकते हैं और माँ-बच्चे को खतरा हो सकता है।`];
        } else {
          condition = ['Possible foetal distress', 'गर्भ में शिशु को खतरे की आशंका'];
          reason = ['The baby is moving less than usual. This can mean the baby is not getting enough oxygen.', 'बच्चे की हलचल सामान्य से कम है। इसका मतलब हो सकता है कि बच्चे को पूरी ऑक्सीजन नहीं मिल रही।'];
        }
        action = ['Refer NOW to the nearest FRU (CHC / District Hospital). Call 108. Keep her lying on her left side, go with her and carry the MCP card. Do not give any medicine on your own.',
          'तुरंत नज़दीकी FRU (CHC / जिला अस्पताल) रेफर करें। 108 बुलाएँ। उन्हें बाईं करवट लिटाएँ, साथ जाएँ और MCP कार्ड साथ रखें। अपने से कोई दवा न दें।'];
      } else if (bpHigh || headache || swelling || has('pale') || has('fever') || has('highfever') || has('vomiting') || has('weak') || has('bellypain')) {

        condition = bpHigh ? ['High BP in pregnancy — needs check-up', 'गर्भावस्था में हाई बीपी — जाँच ज़रूरी'] : ['Needs a closer watch', 'ध्यान से निगरानी ज़रूरी'];
        reason = ['Some warning signs are present but no emergency sign right now.', 'कुछ चेतावनी संकेत हैं, पर अभी कोई आपात संकेत नहीं है।'];
        action = ['Take her to the PHC within 24 hours for BP, urine protein and Hb tests. Re-check BP in 2 days.', '24 घंटे के अंदर PHC ले जाएँ — बीपी, पेशाब में प्रोटीन और Hb की जाँच कराएँ। 2 दिन बाद फिर बीपी नापें।'];
      } else {

      }
    } else if (an.context === 'child') {
      if (ans.drink === false) addSign('Not able to drink / breastfeed', 'पानी / दूध नहीं पी पा रहा');
      if (ans.lethargic === true) addSign('Very sleepy / sunken eyes', 'बहुत सुस्त / आँखें धँसी');
      if (ans.muac) addSign(`MUAC tape: ${ans.muac.toUpperCase()}`, `MUAC पट्टी: ${{ red: 'लाल', yellow: 'पीला', green: 'हरा' }[ans.muac]}`);
      const diarrhoea = has('diarrhoea');
      if (ans.drink === false || ans.lethargic === true || ans.muac === 'red' || has('breathing') || has('convulsion')) {
        level = 'RED';
        if (ans.muac === 'red') {
          condition = diarrhoea ? ['Possible severe acute malnutrition (SAM) with diarrhoea', 'दस्त के साथ गंभीर तीव्र कुपोषण (SAM) की आशंका'] : ['Possible severe acute malnutrition (SAM)', 'गंभीर तीव्र कुपोषण (SAM) की आशंका'];
          reason = ['The arm tape is in the RED zone — the child is dangerously thin' + (diarrhoea ? ' and is losing water through diarrhoea.' : '.'),
            'बाँह की पट्टी लाल ज़ोन में है — बच्चा खतरनाक रूप से दुबला है' + (diarrhoea ? ' और दस्त से शरीर का पानी कम हो रहा है।' : '।')];
        } else {
          condition = ['Possible severe dehydration / serious illness', 'गंभीर निर्जलीकरण / गंभीर बीमारी की आशंका'];
          reason = ['Not drinking, very sleepy or sunken eyes are general danger signs in a child.', 'पानी न पीना, बहुत सुस्ती या धँसी आँखें — ये बच्चे में खतरे के संकेत हैं।'];
        }
        action = ['Refer TODAY to the NRC / CHC. Give small sips of ORS on the way. Call 108 if the child is very weak.', 'आज ही NRC / CHC रेफर करें। रास्ते में ORS के घूँट देते रहें। बच्चा बहुत कमज़ोर हो तो 108 बुलाएँ।'];
      } else if (diarrhoea || has('thin') || has('fever') || has('highfever') || has('vomiting') || ans.muac === 'yellow') {
        level = 'YELLOW';
        condition = ['Diarrhoea / low weight — needs follow-up', 'दस्त / कम वज़न — फॉलो-अप ज़रूरी'];
        reason = ['The child is thin and unwell, but no emergency sign right now.', 'बच्चा दुबला और बीमार है, पर अभी कोई आपात संकेत नहीं है।'];
        action = ['Give ORS + zinc for 14 days, continue feeding, weigh the child. Take to PHC if not better in 2 days.', 'ORS और 14 दिन ज़िंक दें, खाना-दूध जारी रखें, वज़न लें। 2 दिन में ठीक न हो तो PHC ले जाएँ।'];
      } else {

      }

      if (temp) addSign(`Temperature ${temp}°F`, `तापमान ${temp}°F`);

        } else {
          condition = ['Serious illness — danger signs present', 'गंभीर बीमारी — खतरे के संकेत'];
          reason = ['Very high fever, breathing trouble or not eating / drinking are danger signs.', 'बहुत तेज़ बुखार, साँस की तकलीफ या खा-पी न पाना खतरे के संकेत हैं।'];
        }

      } else if (sickle || has('fever') || has('jointpain') || has('diarrhoea') || has('vomiting') || (ans.days && ans.days >= 3) || an.found.length) {
        level = 'YELLOW';
        condition = sickle ? ['Sickle cell patient with symptoms — watch closely', 'लक्षणों वाला सिकल सेल मरीज़ — ध्यान से निगरानी'] : ['Fever / illness — needs testing', 'बुखार / बीमारी — जाँच ज़रूरी'];
        reason = ['Symptoms are present but no emergency sign right now.', 'लक्षण हैं, पर अभी कोई आपात संकेत नहीं है।'];
        action = ['Do a malaria RDT, give paracetamol and fluids, check again tomorrow. Refer if fever goes above 101°F.', 'मलेरिया RDT जाँच करें, पैरासिटामोल और पानी दें, कल फिर देखें। बुखार 101°F से ऊपर जाए तो रेफर करें।'];
      } else {
        reason = ['No danger sign found at this time.', 'अभी कोई खतरे का संकेत नहीं मिला।'];
        action = ['Advise rest and fluids. Visit again if it gets worse.', 'आराम और पानी की सलाह दें। तबीयत बिगड़े तो फिर देखें।'];
      }
    }
    return { level, condition, signs, reason, action, patientUpdates };
  }

  /* ---------- 3c. Anaemia photo screening (computer-vision heuristic) ---------- */
  const ANAEMIA_BANDS = [
    { id: 'normal', min: 0.47, label: ['Normal', 'सामान्य'], hb: ['Hb likely ≥ 11 g/dL', 'Hb संभवतः ≥ 11'], color: '#059669' },
    { id: 'mild', min: 0.43, label: ['Mild', 'हल्का'], hb: ['Hb likely 10–10.9 g/dL', 'Hb संभवतः 10–10.9'], color: '#eab308' },
    { id: 'moderate', min: 0.39, label: ['Moderate', 'मध्यम'], hb: ['Hb likely 7–9.9 g/dL', 'Hb संभवतः 7–9.9'], color: '#f97316' },
    { id: 'severe', min: 0, label: ['Severe', 'गंभीर'], hb: ['Hb likely < 7 g/dL', 'Hb संभवतः 7 से कम'], color: '#dc2626' },
  ];
  const classifyRedness = (ratio) => ANAEMIA_BANDS.find((b) => ratio >= b.min);

  /** Average redness R/(R+G+B) of the centre 40% of an image. */
  function analyzeRedness(dataUrl) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 400 / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
        const x0 = Math.floor(w * 0.3), y0 = Math.floor(h * 0.3);
        const d = ctx.getImageData(x0, y0, Math.max(1, Math.floor(w * 0.4)), Math.max(1, Math.floor(h * 0.4))).data;
        let R = 0, G = 0, B = 0, n = 0;
        const accumulate = (skipExtremes) => {
          for (let i = 0; i < d.length; i += 4) {
            const s = d[i] + d[i + 1] + d[i + 2];
            if (skipExtremes && (s < 60 || s > 735)) continue; // ignore very dark or blown-out pixels
            R += d[i]; G += d[i + 1]; B += d[i + 2]; n++;
          }
        };
        accumulate(true);
        if (n === 0) accumulate(false);
        const total = R + G + B || 1;
        resolve({ ratio: R / total, avg: [R / n, G / n, B / n].map(Math.round) });
      };
      img.onerror = () => reject(new Error('Could not read image'));
      img.src = dataUrl;
    });
  }

  /** Draws a synthetic inner-eyelid photo for the demo (no real patient images needed). */
  function makeEyelidSample(kind) {
    const tone = { healthy: [196, 78, 92], pale: [214, 160, 154], verypale: [228, 200, 190] }[kind];
    const c = document.createElement('canvas'); c.width = 480; c.height = 320;
    const ctx = c.getContext('2d');
    const rnd = mulberry32(hashStr(kind));
    // skin
    const g = ctx.createLinearGradient(0, 0, 0, 320); g.addColorStop(0, '#b77a55'); g.addColorStop(1, '#9c6443');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 480, 320);
    // eyeball (top)
    ctx.fillStyle = '#f4f1ea'; ctx.beginPath(); ctx.ellipse(240, 70, 210, 70, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3b2a1e'; ctx.beginPath(); ctx.arc(240, 40, 46, 0, Math.PI * 2); ctx.fill();
    // conjunctiva (inner lower eyelid) — the area we analyse
    ctx.save(); ctx.beginPath(); ctx.ellipse(240, 170, 215, 95, 0, 0, Math.PI * 2); ctx.clip();
    const [r0, g0, b0] = tone;
    const cg = ctx.createRadialGradient(240, 170, 20, 240, 170, 220);
    cg.addColorStop(0, `rgb(${r0},${g0},${b0})`); cg.addColorStop(1, `rgb(${r0 - 18},${g0 - 14},${b0 - 12})`);
    ctx.fillStyle = cg; ctx.fillRect(0, 60, 480, 230);
    for (let i = 0; i < 1400; i++) { // texture
      const v = (rnd() - 0.5) * 18;
      ctx.fillStyle = `rgba(${clamp(r0 + v, 0, 255)},${clamp(g0 + v, 0, 255)},${clamp(b0 + v, 0, 255)},.6)`;
      ctx.fillRect(rnd() * 480, 70 + rnd() * 200, 3, 3);
    }
    if (kind === 'healthy') { // fine blood vessels
      ctx.strokeStyle = 'rgba(170,20,40,.55)'; ctx.lineWidth = 1.4;
      for (let i = 0; i < 14; i++) {
        ctx.beginPath(); let x = 60 + rnd() * 360, y = 90 + rnd() * 160; ctx.moveTo(x, y);
        for (let k = 0; k < 5; k++) { x += (rnd() - 0.5) * 50; y += (rnd() - 0.5) * 24; ctx.lineTo(x, y); }
        ctx.stroke();
      }
    }
    ctx.restore();
    // lower lid skin + lashes
    ctx.fillStyle = '#a06a48'; ctx.beginPath(); ctx.ellipse(240, 300, 260, 50, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2a1b12'; ctx.lineWidth = 2;
    for (let x = 50; x < 440; x += 14) { ctx.beginPath(); ctx.moveTo(x, 262); ctx.lineTo(x - 6, 282); ctx.stroke(); }
    return c.toDataURL('image/jpeg', 0.9);
  }

  function buildPatients() {
    return RAW_PATIENTS.map(([id, name, age, type, villageId, ashaId, x]) => {
      const { next, ...rest } = x;
      const p = { id, name, age, type, villageId, ashaId, sickle: 'none', gravida: 0, ...rest,
        nextVisit: TODAY + next * DAY + 10 * HOUR, lastVisit: TODAY - (7 + (hashStr(id) % 20)) * DAY };
      return { ...p, ...computeRisk(p) };
    });
  }

  /** Target facilities for a referral from a village. */
  function referralTargets(villageId, level) {
    const v = VILLAGE_BY_ID[villageId];
    const fru = nearestFacility(v, (f) => f.fru);
    const phc = nearestFacility(v, (f) => f.type !== 'DH');
    const dh = { f: FAC_BY_ID.dh, km: roadKm(v, FAC_BY_ID.dh) };
    const target = level === 'RED' ? fru : phc;
    return { facilityId: target.f.id, distanceKm: target.km, phcId: phc.f.id, phcKm: phc.km, dhKm: dh.km };
  }

  function makeAmbulance(refId, km) {
    const h = hashStr(refId);
    const letters = 'ABCDEFGHJKLMNPRSTUVWXYZ';
    return {
      vehicle: `MP 18 ${letters[h % 23]}${letters[(h >> 5) % 23]} ${1000 + (h % 9000)}`,
      driver: ['Ramkumar', 'Shivpal', 'Mohan', 'Dilip', 'Harish'][h % 5],
      etaMin: Math.max(8, Math.round((km / 40) * 60) + 6),
    };
  }

  function buildReferrals(patients) {
    const P = Object.fromEntries(patients.map((p) => [p.id, p]));
    const now = Date.now();
    // [id, patient, status, minutes since flagged, minutes to ambulance, condition]
    const rows = [
      ['r1', 'p31', 'sent', 12, null, ['High BP + anaemia in 9th month', '9वें महीने में हाई बीपी + एनीमिया']],
      ['r2', 'p15', 'sent', 18, null, ['Possible pre-eclampsia risk', 'प्री-एक्लेम्पसिया का संभावित खतरा']],
      ['r3', 'p3', 'seen', 42, null, ['Severe anaemia (Hb 6.8) + high BP', 'गंभीर एनीमिया (Hb 6.8) + हाई बीपी']],
      ['r4', 'p25', 'ambulance', 64, 38, ['Severe headache with BP 150/100', 'बीपी 150/100 के साथ तेज़ सिरदर्द']],
      ['r5', 'p12', 'ambulance', 95, 52, ['Possible severe acute malnutrition (SAM)', 'गंभीर तीव्र कुपोषण (SAM) की आशंका']],
      ['r6', 'p37', 'seen', 130, null, ['Teen pregnancy with severe anaemia', 'किशोर गर्भावस्था, गंभीर एनीमिया']],
      ['r7', 'p21', 'completed', 300, 45, ['Reduced baby movement + Hb 6.5', 'शिशु की हलचल कम + Hb 6.5']],
      ['r8', 'p38', 'completed', 420, 33, ['Age 40, previous C-section, high BP', 'उम्र 40, पिछला सिज़ेरियन, हाई बीपी']],
      ['r9', 'p17', 'completed', 1500, 61, ['Possible sickle cell crisis, Hb 6.6', 'सिकल सेल संकट की आशंका, Hb 6.6']],
    ];
    return rows.map(([id, pid, status, ago, ambMin, condition], i) => {
      const p = P[pid];
      const sentAt = now - ago * MIN;
      const t = referralTargets(p.villageId, 'RED');
      const idx = STATUS_ORDER.indexOf(status);
      return {
        id, slipNo: `SS-26-${String(1031 + i).padStart(4, '0')}`, patientId: pid, ashaId: p.ashaId, level: 'RED',
        reasons: p.reasons, condition, ...t, status, source: 'mock',
        createdAt: sentAt - 2 * MIN, sentAt,
        seenAt: idx >= 2 ? sentAt + 6 * MIN : null,
        ambulanceAt: ambMin != null ? sentAt + ambMin * MIN : null,
        completedAt: status === 'completed' ? sentAt + (ambMin + 40) * MIN : null,
        ambulance: ambMin != null ? makeAmbulance(id, t.distanceKm) : null,
      };
    });
  }

  function initState() {
    const patients = buildPatients();
    const referrals = buildReferrals(patients);
    const alerts = referrals.filter((r) => r.status === 'sent' || r.status === 'seen').map((r) => ({
      id: 'al-' + r.id, referralId: r.id, patientId: r.patientId, ashaId: r.ashaId, level: r.level, condition: r.condition, at: r.sentAt,
    }));
    return {
      patients, referrals, alerts,
      screenings: [],                                         // live anaemia screenings this session
      ashaStats: Object.fromEntries(ASHAS.map((a) => [a.id, { visits: a.visits, flagged: a.flagged }])),
    };
  }

  function reducer(state, a) {
    switch (a.type) {
      case 'UPSERT_PATIENT': {
        const exists = state.patients.some((p) => p.id === a.patient.id);
        return { ...state, patients: exists ? state.patients.map((p) => (p.id === a.patient.id ? { ...p, ...a.patient } : p)) : [a.patient, ...state.patients] };
      }
      case 'ADD_REFERRAL': // replaces an unsent draft for the same patient
        return { ...state, referrals: [a.referral, ...state.referrals.filter((r) => !(r.patientId === a.referral.patientId && r.status === 'draft'))] };
      case 'REFERRAL_STATUS': {
        return {
          ...state,
          referrals: state.referrals.map((r) => {
            if (r.id !== a.id) return r;
            if (STATUS_ORDER.indexOf(a.status) <= STATUS_ORDER.indexOf(r.status)) return r; // only move forward
            const upd = { ...r, status: a.status, ...(a.extra || {}) };
            if (a.status === 'sent') upd.sentAt = a.at;
            if (a.status === 'seen') upd.seenAt = a.at;
            if (a.status === 'ambulance') { upd.ambulanceAt = a.at; upd.seenAt = r.seenAt || a.at; }
            if (a.status === 'completed') upd.completedAt = a.at;
            return upd;
          }),
        };
      }
      case 'ADD_ALERT':
        return { ...state, alerts: [a.alert, ...state.alerts].slice(0, 40) };
      case 'ADD_SCREENING':
        return { ...state, screenings: [a.screening, ...state.screenings] };
      case 'LOG_VISIT': {
        const s = state.ashaStats[a.ashaId] || { visits: 0, flagged: 0 };
        return { ...state, ashaStats: { ...state.ashaStats, [a.ashaId]: { visits: s.visits + 1, flagged: s.flagged + (a.flagged ? 1 : 0) } } };
      }
      case 'RESET':
        return initState();
      default:
        return state;
    }
  }

  /** Re-render every `ms` so "time since" labels stay fresh. */
  function useNow(ms = 15000) {

  function useFakeLoad(ms) {

    return loading;

      const rnd = mulberry32(hashStr(seed));
      const g = Array.from({ length: N }, () => Array.from({ length: N }, () => rnd() > 0.52));
      const finder = (r0, c0) => {
        for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
          const rr = r0 + r, cc = c0 + c;
          if (rr < 0 || cc < 0 || rr >= N || cc >= N) continue;
          const edge = r === 0 || r === 6 || c === 0 || c === 6;
          const core = r >= 2 && r <= 4 && c >= 2 && c <= 4;
          g[rr][cc] = r >= 0 && r <= 6 && c >= 0 && c <= 6 && (edge || core);
        }
      };
      finder(0, 0); finder(0, N - 7); finder(N - 7, 0);
      return g;
    }, [seed]);
    return (
      <svg width={size} height={size} viewBox={`-1 -1 ${N + 2} ${N + 2}`} shapeRendering="crispEdges" className="bg-white rounded-lg" aria-label="QR code (demo)">
        {cells.map((row, r) => row.map((on, c) => (on ? <rect key={`${r}-${c}`} x={c} y={r} width="1" height="1" fill="#0b1413" /> : null)))}
      </svg>
    );
  }

  const VOICE_SAMPLES = [
    { text: '7 mahine ki garbhvati, sir dard aur pair mein sujan', patientId: 'p1', icon: 'pregnant', tag: ['Pregnancy', 'गर्भावस्था'] },
    { text: 'bachcha 2 saal, bahut patla, dast 3 din se', patientId: 'p6', icon: 'baby', tag: ['Child', 'बच्चा'] },

  ];

  function VoiceScreen({ go, params, scrollBottom }) {
    const { tr, tx, lang } = useLang();
    const { state, api } = useStore();
    const [patientId, setPatientId] = useState(params.patientId || 'p1');
    const [text, setText] = useState('');
    const [msgs, setMsgs] = useState([]);
    const [analysis, setAnalysis] = useState(null);
    const [questions, setQuestions] = useState([]);
    const [qi, setQi] = useState(-1);
    const [answers, setAnswers] = useState({});
    const [result, setResult] = useState(null);
    const [typing, setTyping] = useState(false);
    const [listening, setListening] = useState(false);
    const [speakOn, setSpeakOn] = useState(true);
    const [saved, setSaved] = useState(false);
    const recRef = useRef(null);
    const timers = useRef([]);
    const langRef = useRef(lang); langRef.current = lang;
    const speakRef = useRef(speakOn); speakRef.current = speakOn;
    const patient = state.patients.find((p) => p.id === patientId);
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    // Clean up timers, speech and recognition when leaving the screen
    useEffect(() => () => {
      timers.current.forEach(clearTimeout);
      try { recRef.current && recRef.current.abort(); } catch (e) { /* ignore */ }
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    }, []);
    useEffect(() => { if (msgs.length) scrollBottom(); }, [msgs.length, typing, result, qi, scrollBottom]);

    const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.current.push(t); };
    /** AI "types" for a moment, then posts a message (and speaks it). */
    const aiSay = (pair, extra = {}, delay = 750) => new Promise((resolve) => {
      setTyping(true);
      later(() => {
        setTyping(false);
        setMsgs((m) => [...m, { id: uid('m'), from: 'ai', text: pair, ...extra }]);
        if (speakRef.current && !extra.silent) speak(pick(pair, langRef.current), langRef.current);
        resolve();
      }, delay);
    });

    const reset = () => {
      timers.current.forEach(clearTimeout); timers.current = [];
      setMsgs([]); setAnalysis(null); setQuestions([]); setQi(-1); setAnswers({}); setResult(null); setTyping(false); setSaved(false); setText('');
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    };

    const finish = async (an, ans) => {
      const r = evaluateVoice(an, ans);
      setQi(-1);
      await aiSay(r.level === 'RED'
        ? ['⚠️ Danger sign found. Please see the result below and refer now.', '⚠️ खतरे का संकेत मिला। नीचे परिणाम देखें और तुरंत रेफर करें।']
        : ['Check-up complete. Here is the result.', 'जाँच पूरी हुई। परिणाम नीचे है।']);
      setResult(r);
      if (speakRef.current) {
        const l = langRef.current;
        later(() => speak(`${pick(RISK_META[r.level].label, l)}. ${r.condition ? pick(r.condition, l) + '. ' : ''}${pick(r.action, l)}`, l), 900);
      }
    };

    const start = async (input, sample) => {
      const clean = String(input || '').trim();
      if (!clean) return;
      reset();
      if (sample && sample.patientId) setPatientId(sample.patientId);
      setMsgs([{ id: uid('m'), from: 'asha', text: clean }]);
      const an = analyzeText(clean);
      setAnalysis(an);
      if (!an.found.length && an.context === 'general') {
        await aiSay(['I could not find clear symptoms. Please say them again, for example: "7 mahine ki garbhvati, sir dard".', 'मुझे साफ़ लक्षण नहीं मिले। कृपया फिर से बताएँ, जैसे: "7 महीने की गर्भवती, सिर दर्द"।']);
        return;
      }
      const ctxName = { maternal: ['a pregnant woman', 'गर्भवती महिला'], child: ['a child', 'बच्चा'], sickle: ['a sickle cell patient', 'सिकल सेल मरीज़'], fever: ['fever', 'बुखार'], general: ['a general illness', 'सामान्य बीमारी'] }[an.context];
      await aiSay([`Understood — ${ctxName[0]}${an.month ? `, ${an.month} months` : ''}. I detected these signs:`, `समझ गई — ${ctxName[1]}${an.month ? `, ${an.month} महीने` : ''}। मैंने ये लक्षण पहचाने:`],
        { chips: an.found.map((s) => s.label) });
      // Emergency signs in the first sentence → no need to ask more
      if (an.ids.has('bleeding') || an.ids.has('convulsion')) { await finish(an, {}); return; }
      const qs = buildQuestions(an);
      setQuestions(qs);
      if (!qs.length) { await finish(an, {}); return; }
      await aiSay(qs[0].q, { q: true }, 900);
      setQi(0);
    };

    const answer = async (q, value, display) => {
      setMsgs((m) => [...m, { id: uid('m'), from: 'asha', text: display }]);
      const next = { ...answers, [q.id]: value };
      setAnswers(next);
      setQi(-1);
      // Early exit as soon as a RED flag is certain (e.g. BP 150/100 + headache + swelling)
      const partial = evaluateVoice(analysis, next);
      const idx = questions.findIndex((x) => x.id === q.id);
      if (partial.level === 'RED' || idx >= questions.length - 1) { await finish(analysis, next); return; }
      await aiSay(questions[idx + 1].q, { q: true });
      setQi(idx + 1);
    };

    const toggleMic = () => {
      if (!SR) { api.toast(['Voice input is not supported in this browser — please type or tap a sample.', 'इस ब्राउज़र में आवाज़ इनपुट नहीं है — कृपया टाइप करें या सैंपल चुनें।'], 'info'); return; }
      if (listening) { try { recRef.current && recRef.current.stop(); } catch (e) { /* ignore */ } return; }
      try {
        const rec = new SR();
        rec.lang = 'hi-IN'; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;
        let finalText = '';
        rec.onresult = (e) => {
          let interim = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) finalText += e.results[i][0].transcript; else interim += e.results[i][0].transcript;
          }
          setText(finalText || interim);
        };
        rec.onerror = (e) => {
          setListening(false);
          if (e.error !== 'aborted' && e.error !== 'no-speech') api.toast([`Mic error: ${e.error}. Please type instead.`, `माइक त्रुटि: ${e.error}। कृपया टाइप करें।`], 'error');
        };
        rec.onend = () => { setListening(false); if (finalText.trim()) start(finalText); };
        recRef.current = rec;
        rec.start();
        setListening(true);
      } catch (e) {
        setListening(false);
        api.toast(['Could not start the microphone. Please type instead.', 'माइक शुरू नहीं हो सका। कृपया टाइप करें।'], 'error');
      }
    };

    const onSave = () => {
      api.saveCheckup(patientId, result);
      setSaved(true);
    };
    const onRefer = () => {
      const refId = api.createReferral(patientId, { level: result.level === 'GREEN' ? 'YELLOW' : result.level, reasons: result.signs, condition: result.condition, source: 'voice', patientUpdates: result.patientUpdates });
      go('referral', { refId });
    };

    const currentQ = qi >= 0 ? questions[qi] : null;
    const started = msgs.length > 0;

    return (
      <div>
        <div className="flex items-end gap-2">
          <div className="flex-1"><PatientSelect value={patientId} onChange={setPatientId} /></div>
          <button onClick={() => { setSpeakOn(!speakOn); try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }}
            className={`h-[50px] w-[50px] rounded-xl flex items-center justify-center ring-1 ${speakOn ? 'bg-brand-50 text-brand-700 ring-brand-200' : 'bg-slate-100 text-slate-400 ring-slate-200'}`}
            title={tr('AI voice replies on/off', 'AI की आवाज़ चालू/बंद')} aria-label="Toggle voice replies">
            <Icon name={speakOn ? 'volume' : 'volumeOff'} className="w-6 h-6" />
          </button>
        </div>

        {!started && (
          <div className="mt-4 fade-in">
            <Card className="p-5 flex flex-col items-center text-center">
              <button onClick={toggleMic} className="relative w-28 h-28 rounded-full focus-ring" aria-label={tr('Tap to speak', 'बोलने के लिए दबाएँ')}>
                {listening && <><span className="mic-ring" /><span className="mic-ring r2" /><span className="mic-ring r3" /></>}
                <span className={`relative z-10 w-28 h-28 rounded-full flex items-center justify-center text-white shadow-lift transition ${listening ? 'bg-red-600 scale-105' : 'bg-gradient-to-br from-brand-500 to-brand-800'}`}>
                  <Icon name={listening ? 'stop' : 'mic'} className="w-12 h-12" />
                </span>
              </button>
              <div className="mt-3 font-bold text-slate-900 text-lg">{listening ? tr('Listening… speak in Hindi', 'सुन रही हूँ… हिंदी में बोलें') : tr('Tap and speak the symptoms', 'दबाएँ और लक्षण बोलें')}</div>
              <div className="text-xs text-slate-500">{SR ? tr('Hindi voice (hi-IN) · you can also type below', 'हिंदी आवाज़ (hi-IN) · नीचे टाइप भी कर सकते हैं') : tr('Voice not supported here — type below or tap a sample', 'यहाँ आवाज़ उपलब्ध नहीं — नीचे टाइप करें या सैंपल चुनें')}</div>
              <form className="mt-4 w-full flex gap-2" onSubmit={(e) => { e.preventDefault(); start(text); }}>
                <div className="flex-1 flex items-center gap-2 rounded-xl border border-slate-200 px-3 bg-white">
                  <Icon name="keyboard" className="w-5 h-5 text-slate-400" />
                  <input value={text} onChange={(e) => setText(e.target.value)} placeholder={tr('Type symptoms (Hindi / English)…', 'लक्षण लिखें (हिंदी / English)…')} className="flex-1 py-3 text-[15px] outline-none bg-transparent min-w-0" />
                </div>
                <button type="submit" className="rounded-xl bg-brand-700 text-white px-4 font-semibold disabled:opacity-40" disabled={!text.trim()} aria-label="Send"><Icon name="send" className="w-5 h-5" /></button>
              </form>
            </Card>
            <div className="mt-4 text-xs font-bold uppercase tracking-wide text-slate-500">{tr('Demo samples — tap one', 'डेमो सैंपल — किसी एक पर टैप करें')}</div>
            <div className="mt-2 space-y-2">
              {VOICE_SAMPLES.map((s, i) => (
                <button key={i} onClick={() => start(s.text, s)} className="w-full text-left bg-white rounded-2xl p-3 shadow-card ring-1 ring-slate-100 flex items-center gap-3 hover:ring-brand-300 active:scale-[.99] transition">
                  <span className="w-11 h-11 shrink-0 rounded-xl bg-brand-50 text-brand-700 flex items-center justify-center"><Icon name={s.icon} className="w-6 h-6" /></span>
                  <span className="min-w-0">
                    <span className="block text-[11px] font-bold text-brand-700">{i + 1}. {tx(s.tag)}</span>
                    <span className="block text-[14px] font-semibold text-slate-800 leading-snug">"{s.text}"</span>
                  </span>
                </button>
              ))}
            </div>
          </div>
        )}

        {started && (
          <div className="mt-4 space-y-3">
            {msgs.map((m) => (
              <div key={m.id} className={`flex ${m.from === 'asha' ? 'justify-end' : 'justify-start'} fade-in`}>
                {m.from === 'ai' && <div className="w-8 h-8 shrink-0 mr-2 rounded-full bg-brand-700 text-white flex items-center justify-center"><Icon name="sparkle" className="w-4 h-4" /></div>}
                <div className={`max-w-[80%] rounded-2xl px-3.5 py-2.5 text-[14.5px] leading-snug shadow-card ${m.from === 'asha' ? 'bg-brand-700 text-white rounded-br-md' : 'bg-white text-slate-800 rounded-bl-md ring-1 ring-slate-100'}`}>
                  {m.from === 'asha' && <div className="text-[10px] font-bold text-brand-100 mb-0.5 flex items-center gap-1"><Icon name="mic" className="w-3 h-3" />{tr('Sunita (ASHA)', 'सुनीता (आशा)')}</div>}
                  {m.q && <div className="text-[10px] font-bold text-brand-600 mb-0.5">{tr('QUESTION', 'सवाल')}</div>}
                  <div>{tx(m.text)}</div>
                  {m.chips && (
                    <div className="mt-2 flex flex-wrap gap-1.5">
                      {m.chips.map((c, i) => <span key={i} className="text-[12px] font-semibold bg-amber-50 text-amber-900 ring-1 ring-amber-200 rounded-full px-2 py-0.5">{tx(c)}</span>)}
                    </div>
                  )}
                </div>
              </div>
            ))}
            {typing && (
              <div className="flex items-center">
                <div className="w-8 h-8 shrink-0 mr-2 rounded-full bg-brand-700 text-white flex items-center justify-center"><Icon name="sparkle" className="w-4 h-4" /></div>
                <div className="bg-white rounded-2xl px-4 py-3 shadow-card ring-1 ring-slate-100 typing"><span /><span /><span /></div>
              </div>
            )}
            {currentQ && <AnswerBar q={currentQ} onAnswer={answer} />}
            {result && (
              <VoiceResultCard result={result} patient={patient} saved={saved} onSave={onSave} onRefer={onRefer} onNew={reset} />
            )}
            {!result && !typing && !currentQ && (
              <button onClick={reset} className="w-full py-3 rounded-2xl bg-white ring-1 ring-slate-200 font-semibold text-slate-700 flex items-center justify-center gap-2"><Icon name="refresh" className="w-4 h-4" />{tr('Start again', 'फिर से शुरू करें')}</button>
            )}
          </div>
        )}
        <Disclaimer />
      </div>
    );
  }

  /** Input for the AI's follow-up question (yes/no, BP, number or choice). */
  function AnswerBar({ q, onAnswer }) {
    const { tr, tx } = useLang();
    const [val, setVal] = useState('');
    const [err, setErr] = useState('');
    const inputRef = useRef(null);
    useEffect(() => { setVal(''); setErr(''); if (inputRef.current) inputRef.current.focus({ preventScroll: true }); }, [q.id]);

    if (q.type === 'yesno') {
      return (
        <div className="grid grid-cols-2 gap-2 pop-in">
          <button onClick={() => onAnswer(q, true, tr('Yes', 'हाँ'))} className="py-4 rounded-2xl bg-white ring-2 ring-red-200 text-red-700 font-bold text-lg flex items-center justify-center gap-2 active:scale-95 transition"><Icon name="check" className="w-5 h-5" sw={3} />{tr('Yes', 'हाँ')}</button>
          <button onClick={() => onAnswer(q, false, tr('No', 'नहीं'))} className="py-4 rounded-2xl bg-white ring-2 ring-emerald-200 text-emerald-700 font-bold text-lg flex items-center justify-center gap-2 active:scale-95 transition"><Icon name="x" className="w-5 h-5" sw={3} />{tr('No', 'नहीं')}</button>
        </div>
      );
    }
    if (q.type === 'choice') {
      return (
        <div className="grid grid-cols-3 gap-2 pop-in">
          {q.options.map((o) => (
            <button key={o.v} onClick={() => onAnswer(q, o.v, tx(o.l))} className={`py-4 rounded-2xl font-bold text-base shadow-card active:scale-95 transition ${o.c}`}>{tx(o.l)}</button>
          ))}
        </div>
      );
    }
    const submit = (e) => {
      e.preventDefault();
      if (q.type === 'bp') {
        const m = val.match(/^\s*(\d{2,3})\s*[\/\-\s]\s*(\d{2,3})\s*$/);
        if (!m || +m[1] < 60 || +m[1] > 260 || +m[2] < 30 || +m[2] > 160) { setErr(tr('Please enter BP like 150/100', 'कृपया बीपी ऐसे लिखें: 150/100')); return; }
        onAnswer(q, [+m[1], +m[2]], `BP ${m[1]}/${m[2]}`);
      } else {
        const n = parseFloat(val);
        if (isNaN(n) || n < q.min || n > q.max) { setErr(tr(`Enter a number between ${q.min} and ${q.max}`, `${q.min} से ${q.max} के बीच संख्या लिखें`)); return; }
        onAnswer(q, n, `${n} ${tx(q.unit)}`);
      }
    };
    return (
      <form onSubmit={submit} className="pop-in bg-white rounded-2xl p-3 shadow-card ring-2 ring-brand-200">
        <div className="flex gap-2">
          <input ref={inputRef} value={val} onChange={(e) => { setVal(e.target.value); setErr(''); }}
            inputMode={q.type === 'bp' ? 'text' : 'decimal'} placeholder={q.type === 'bp' ? '150/100' : q.placeholder}
            className="flex-1 min-w-0 rounded-xl border border-slate-200 px-3 py-3 text-xl font-bold tracking-wide text-slate-900 outline-none focus:border-brand-500" />
          <button type="submit" className="rounded-xl bg-brand-700 text-white px-5 font-bold">{tr('OK', 'ठीक')}</button>
        </div>
        {q.type === 'bp' && (
          <div className="mt-2 flex gap-1.5 flex-wrap">
            {['150/100', '130/85', '110/70'].map((v) => <button type="button" key={v} onClick={() => setVal(v)} className="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-700">{v}</button>)}
          </div>
        )}
        {err && <div className="mt-2 text-sm text-red-600 font-medium">{err}</div>}
      </form>
    );
  }

  function VoiceResultCard({ result, patient, saved, onSave, onRefer, onNew }) {
    const { tr, tx } = useLang();
    const m = RISK_META[result.level];
    return (
      <div className={`pop-in rounded-3xl border-2 overflow-hidden bg-white shadow-lift ${m.soft}`}>
        <div className={`${m.solid} px-4 py-3 flex items-center gap-3`}>
          <span className="w-11 h-11 rounded-full bg-white/25 flex items-center justify-center"><Icon name={m.icon} className="w-6 h-6" sw={2.5} /></span>
          <div>
            <div className="text-[11px] font-bold opacity-90 uppercase tracking-wider">{tr('AI risk flag', 'AI जोखिम संकेत')}</div>
            <div className="text-xl font-extrabold leading-tight">{tx(m.label)}</div>
          </div>
        </div>
        <div className="p-4 bg-white space-y-3">
          {result.condition && <div className={`text-[17px] font-bold ${m.text}`}>{tx(result.condition)}</div>}
          {patient && <div className="text-xs text-slate-500">{patient.name} · {tx(VILLAGE_BY_ID[patient.villageId].name)}</div>}
          {result.signs.length > 0 && (
            <div>
              <div className="text-xs font-bold text-slate-500 uppercase">{tr('Danger signs detected', 'पहचाने गए खतरे के संकेत')}</div>
              <div className="mt-1.5 flex flex-wrap gap-1.5">
                {result.signs.map((s, i) => <span key={i} className="inline-flex items-center gap-1 text-[12.5px] font-semibold bg-red-50 text-red-800 ring-1 ring-red-100 rounded-full px-2 py-0.5"><Icon name="alert" className="w-3 h-3" />{tx(s)}</span>)}
              </div>
            </div>
          )}
          <div className="rounded-xl bg-slate-50 p-3">
            <div className="text-xs font-bold text-slate-500 uppercase flex items-center gap-1"><Icon name="info" className="w-3.5 h-3.5" />{tr('Why this flag?', 'यह संकेत क्यों?')}</div>
            <div className="mt-1 text-[14px] text-slate-800 leading-snug">{tx(result.reason)}</div>
          </div>
          <div className="rounded-xl bg-brand-50 p-3 ring-1 ring-brand-100">
            <div className="text-xs font-bold text-brand-700 uppercase flex items-center gap-1"><Icon name="check" className="w-3.5 h-3.5" sw={3} />{tr('What to do now', 'अब क्या करें')}</div>
            <div className="mt-1 text-[14px] text-slate-800 leading-snug font-medium">{tx(result.action)}</div>
          </div>
          <div className="text-[11px] text-slate-500 flex gap-1.5"><Icon name="shield" className="w-3.5 h-3.5 shrink-0" />{tr('This is a risk flag, not a diagnosis. The doctor will confirm.', 'यह जोखिम संकेत है, निदान नहीं। डॉक्टर पुष्टि करेंगे।')}</div>
          <div className="grid grid-cols-2 gap-2 pt-1">
            {result.level !== 'GREEN' && (
              <button onClick={onRefer} className={`col-span-2 py-4 rounded-2xl font-extrabold text-lg flex items-center justify-center gap-2 shadow-card active:scale-[.98] transition ${result.level === 'RED' ? 'bg-red-600 text-white' : 'bg-amber-500 text-white'}`}>
                <Icon name="send" className="w-5 h-5" />{result.level === 'RED' ? tr('Refer now', 'अभी रेफर करें') : tr('Refer to PHC', 'PHC रेफर करें')}
              </button>
            )}
            <button onClick={onSave} disabled={saved} className="py-3 rounded-2xl bg-white ring-1 ring-slate-200 font-semibold text-slate-800 flex items-center justify-center gap-1.5 disabled:opacity-60">
              <Icon name={saved ? 'check' : 'save'} className="w-4 h-4" />{saved ? tr('Saved', 'सेव हुआ') : tr('Save case', 'केस सेव करें')}
            </button>
            <button onClick={onNew} className="py-3 rounded-2xl bg-white ring-1 ring-slate-200 font-semibold text-slate-800 flex items-center justify-center gap-1.5"><Icon name="refresh" className="w-4 h-4" />{tr('New check-up', 'नई जाँच')}</button>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- 7.3 Scan register (mock OCR) ---------- */
  function ScanScreen({ go }) {
    const { tr, tx, lang } = useLang();
    const { api } = useStore();
    const [image, setImage] = useState(null);
    const [phase, setPhase] = useState('idle'); // idle | scanning | form | saved
    const [progress, setProgress] = useState(0);
    const [form, setForm] = useState(null);
    const [conf, setConf] = useState({});
    const [shown, setShown] = useState(0);
    const [savedPatient, setSavedPatient] = useState(null);
    const timers = useRef([]);
    useEffect(() => () => timers.current.forEach((t) => clearTimeout(t) || clearInterval(t)), []);

    const runOCR = (dataUrl, setIdx) => {
      setImage(dataUrl); setPhase('scanning'); setProgress(0); setShown(0);
      const set = OCR_SETS[setIdx];
      let p = 0;
      const iv = setInterval(() => {
        p = Math.min(100, p + 4);
        setProgress(p);
        if (p >= 100) {
          clearInterval(iv);
          setForm({ name: set.name, age: String(set.age), lmp: toISODate(TODAY - set.lmpDaysAgo * DAY), hb: String(set.hb), bp: set.bp, weight: String(set.weight), village: 'kudri' });
          setConf(set.conf);
          setPhase('form');
          // reveal fields one by one
          [1, 2, 3, 4, 5, 6].forEach((i) => timers.current.push(setTimeout(() => setShown(i), i * 140)));
        }
      }, 95);
      timers.current.push(iv);
    };
    const onFile = (e) => {
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      if (!f.type.startsWith('image/')) { api.toast(['Please choose an image file.', 'कृपया फ़ोटो फ़ाइल चुनें।'], 'error'); return; }
      const reader = new FileReader();
      reader.onload = () => runOCR(reader.result, f.size % OCR_SETS.length);
      reader.onerror = () => api.toast(['Could not read the photo.', 'फ़ोटो नहीं पढ़ी जा सकी।'], 'error');
      reader.readAsDataURL(f);
    };
    const useSample = async () => runOCR(await makeRegisterSample(), 0);

    const lmpTs = form && form.lmp ? fromISODate(form.lmp) : null;
    const gestDays = lmpTs ? Math.max(0, Math.round((Date.now() - lmpTs) / DAY)) : 0;
    const month = clamp(Math.ceil(gestDays / 30.4) || 1, 1, 9);
    const edd = lmpTs ? lmpTs + 280 * DAY : null;

    const save = () => {
      const bpM = String(form.bp).match(/(\d{2,3})\s*\/\s*(\d{2,3})/);
      if (!form.name.trim() || !(+form.age > 0)) { api.toast(['Name and age are required.', 'नाम और उम्र ज़रूरी हैं।'], 'error'); return; }
      const p = {
        id: uid('p'), name: form.name.trim(), age: +form.age, type: 'pregnant', villageId: form.village, ashaId: ME,
        month, hb: parseFloat(form.hb) || null, bp: bpM ? [+bpM[1], +bpM[2]] : null, weight: parseFloat(form.weight) || null,
        lmp: lmpTs, gravida: 0, sickle: 'none', nextVisit: startOfDay() + 7 * DAY + 10 * HOUR, lastVisit: Date.now(), source: 'ocr',
      };
      const full = { ...p, ...computeRisk(p) };
      api.addPatient(full);
      setSavedPatient(full);
      setPhase('saved');
      api.toast(['Saved! 6 minutes of paperwork saved ⏱️', 'सेव हो गया! 6 मिनट का कागज़ी काम बचा ⏱️'], 'success');
    };

    const Field = ({ k, i, label, type = 'text', suffix }) => {
      if (shown < i) return <div className="skeleton h-[62px]" />;
      const c = conf[k];
      const low = c && c < 85;
      return (
        <label className="block fade-in">
          <span className="flex items-center justify-between text-xs font-semibold text-slate-500">
            {label}
            {c && <span className={`rounded-full px-1.5 py-0.5 text-[10px] font-bold ${low ? 'bg-amber-100 text-amber-800' : 'bg-emerald-50 text-emerald-700'}`}>{low ? tr(`${c}% · please verify`, `${c}% · जाँच लें`) : `${c}%`}</span>}
          </span>
          <div className={`mt-1 flex items-center rounded-xl border bg-white ${low ? 'border-amber-300 ring-2 ring-amber-100' : 'border-slate-200'}`}>

  /* ---------- 7.4 Anaemia screening (photo) ---------- */
  function Gauge({ ratio }) {
    // Map redness 0.33 → 0.55 onto a 180° dial (left = severe, right = normal)
    const lo = 0.33, hi = 0.55;
    const toAngle = (r) => 180 - ((clamp(r, lo, hi) - lo) / (hi - lo)) * 180;
    const polar = (deg, rad) => [100 + rad * Math.cos((deg * Math.PI) / 180), 100 - rad * Math.sin((deg * Math.PI) / 180)];
    const arc = (a0, a1, rad) => { const [x0, y0] = polar(a0, rad), [x1, y1] = polar(a1, rad); return `M${x0} ${y0} A${rad} ${rad} 0 0 1 ${x1} ${y1}`; };
    const segs = [...ANAEMIA_BANDS].reverse().map((b, i, arr) => {
      const from = i === 0 ? lo : b.min;
      const to = i === arr.length - 1 ? hi : arr[i + 1].min;
      return { ...b, a0: toAngle(from), a1: toAngle(to) };
    });
    const needle = toAngle(ratio);
    return (
      <svg viewBox="0 0 200 118" className="w-full max-w-[260px] mx-auto" role="img" aria-label="Anaemia gauge">
        {segs.map((s) => <path key={s.id} d={arc(s.a0, s.a1, 78)} stroke={s.color} strokeWidth="18" fill="none" />)}
        <g className="gauge-needle" style={{ transform: `rotate(${90 - needle}deg)`, transformOrigin: '100px 100px' }}>
          <path d="M100 100 L96 100 L100 30 L104 100 Z" fill="#0f172a" />
        </g>
        <circle cx="100" cy="100" r="8" fill="#0f172a" />
        <text x="18" y="116" fontSize="10" fill="#64748b">Severe</text>
        <text x="152" y="116" fontSize="10" fill="#64748b">Normal</text>
      </svg>
    );
  }

            <button key={k} onClick={() => setSite(k)} className={`py-2 rounded-xl text-sm font-semibold ${site === k ? 'bg-white shadow-card text-rose-700' : 'text-slate-600'}`}>{l}</button>
          ))}
        </div>
        {!image && (

            <div className="flex items-start gap-3 text-sm text-slate-600">
              <span className="w-10 h-10 shrink-0 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center"><Icon name="eye" className="w-6 h-6" /></span>
              <span>{site === 'eyelid'
                ? tr('Gently pull the lower eyelid down. Use daylight. Keep the pink inner part in the centre of the photo.', 'निचली पलक को धीरे से नीचे खींचें। दिन की रोशनी में फ़ोटो लें। अंदर का गुलाबी हिस्सा बीच में रखें।')
                : tr('Place the fingernail in the centre. No nail polish. Use daylight.', 'नाखून को फ़ोटो के बीच में रखें। नेल पॉलिश न हो। दिन की रोशनी में लें।')}</span>
            </div>
            <div className="mt-4 grid grid-cols-2 gap-2">

  /* ---------- 7.5 High-risk pregnancy score ---------- */
  function ScoreScreen({ go, params }) {
    const { tr, tx } = useLang();
    const { state, api } = useStore();
    const isPreg = (p) => p.type === 'pregnant';
    const firstId = params.patientId || (state.patients.find((p) => p.ashaId === ME && isPreg(p)) || {}).id || 'new';
    const [patientId, setPatientId] = useState(firstId);
    const fromPatient = (id) => {
      const p = state.patients.find((x) => x.id === id);
      if (!p) return { name: '', age: '', month: '6', hb: '', bpS: '', bpD: '', gravida: '0', prevCS: false, bleeding: false, swelling: false, headache: false, convulsions: false, lessMove: false, sickle: 'none', distance: String(VILLAGE_BY_ID.kudri.fruKm), village: 'kudri' };
      const f = pregInputFromPatient(p);
      return { ...f, name: p.name, age: String(f.age ?? ''), month: String(f.month ?? '6'), hb: String(f.hb ?? ''), bpS: String(f.bpS ?? ''), bpD: String(f.bpD ?? ''), gravida: String(f.gravida), distance: String(f.distance), village: p.villageId };
    };
    const [f, setF] = useState(() => fromPatient(firstId));
    const [saved, setSaved] = useState(false);
    const set = (k, v) => { setF((o) => ({ ...o, [k]: v })); setSaved(false); };
    const r = useMemo(() => scorePregnancy(f), [f]);
    const m = RISK_META[r.band];

    const onPatient = (id) => { setPatientId(id); setF(fromPatient(id)); setSaved(false); };

    const persist = () => {
      if (patientId === 'new' && !f.name.trim()) { api.toast(['Please enter the name.', 'कृपया नाम लिखें।'], 'error'); return null; }
      const data = {
        age: +f.age || null, month: +f.month, hb: parseFloat(f.hb) || null, bp: f.bpS && f.bpD ? [+f.bpS, +f.bpD] : null, gravida: +f.gravida || 0,
        prevCS: f.prevCS, bleeding: f.bleeding, swelling: f.swelling, headache: f.headache, convulsions: f.convulsions, lessMove: f.lessMove, sickle: f.sickle,
        risk: r.band, score: r.score, reasons: r.factors.map((x) => x.label), lastVisit: Date.now(),
      };
      let id = patientId;
      if (patientId === 'new') {
        id = uid('p');
        api.addPatient({ id, name: f.name.trim(), type: 'pregnant', villageId: f.village, ashaId: ME, nextVisit: startOfDay() + 7 * DAY + 10 * HOUR, ...data });
        setPatientId(id);
      } else {
        api.updatePatient({ id, ...data });
      }
      return id;
    };
    const onSave = () => { if (persist()) { setSaved(true); api.toast(['Risk score saved to patient record', 'जोखिम स्कोर मरीज़ के रिकॉर्ड में सेव हुआ'], 'success'); } };
    const onRefer = () => {
      const id = persist();
      if (!id) return;
      const refId = api.createReferral(id, { level: r.band, reasons: r.factors.map((x) => x.label), condition: conditionFromScore(r), source: 'score' });
      go('referral', { refId });
    };

    const Num = ({ k, label, suffix, step = '1', w = '' }) => (
      <label className={`block ${w}`}>
        <span className="text-xs font-semibold text-slate-500">{label}</span>
        <div className="mt-1 flex items-center rounded-xl border border-slate-200 bg-white focus-within:border-brand-500">
          <input type="number" inputMode="decimal" step={step} value={f[k]} onChange={(e) => set(k, e.target.value)} className="flex-1 min-w-0 px-3 py-2.5 text-[16px] font-bold text-slate-900 outline-none bg-transparent" />
          {suffix && <span className="pr-3 text-xs text-slate-400">{suffix}</span>}
        </div>
      </label>
    );
    const Toggle = ({ k, label, danger }) => (
      <button type="button" onClick={() => set(k, !f[k])}
        className={`w-full flex items-center justify-between gap-2 rounded-xl px-3 py-3 text-left text-[14px] font-semibold ring-1 transition ${f[k] ? (danger ? 'bg-red-50 ring-red-300 text-red-800' : 'bg-amber-50 ring-amber-300 text-amber-900') : 'bg-white ring-slate-200 text-slate-700'}`}>
        <span className="flex items-center gap-2">{danger && <Icon name="alert" className="w-4 h-4 shrink-0" />}{label}</span>
        <span className={`shrink-0 text-xs font-bold rounded-full px-2.5 py-1 ${f[k] ? (danger ? 'bg-red-600 text-white' : 'bg-amber-500 text-white') : 'bg-slate-100 text-slate-500'}`}>{f[k] ? tr('YES', 'हाँ') : tr('NO', 'नहीं')}</span>
      </button>
    );

    return (
      <div>
        <PatientSelect value={patientId} onChange={onPatient} filter={isPreg} allowNew />
        {/* Sticky live score */}
        <div className={`sticky top-0 z-10 mt-3 rounded-2xl ${m.solid} shadow-lift px-4 py-3 flex items-center gap-3`}>
          <div className="relative w-14 h-14 shrink-0">
            <svg viewBox="0 0 36 36" className="w-14 h-14 -rotate-90"><circle cx="18" cy="18" r="15.5" fill="none" stroke="rgba(255,255,255,.3)" strokeWidth="4" /><circle cx="18" cy="18" r="15.5" fill="none" stroke="#fff" strokeWidth="4" strokeDasharray={`${(r.score / 100) * 97.4} 97.4`} strokeLinecap="round" style={{ transition: 'stroke-dasharray .6s' }} /></svg>
            <div className="absolute inset-0 flex items-center justify-center text-lg font-extrabold">{r.score}</div>
          </div>
          <div className="min-w-0">
            <div className="text-[11px] font-bold uppercase opacity-90">{tr('Risk score / 100', 'जोखिम स्कोर / 100')}</div>
            <div className="text-lg font-extrabold leading-tight">{tx(m.label)}</div>
            {r.autoRed && <div className="text-[11px] font-semibold opacity-95">{tr('Automatic RED: danger sign present', 'स्वतः लाल: खतरे का संकेत मौजूद')}</div>}
          </div>
        </div>

        <Card className="mt-3 p-4 space-y-3">
          {patientId === 'new' && (
            <label className="block"><span className="text-xs font-semibold text-slate-500">{tr('Name', 'नाम')}</span>
              <input value={f.name} onChange={(e) => set('name', e.target.value)} className="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-[16px] font-bold outline-none focus:border-brand-500" /></label>
          )}
          <div className="grid grid-cols-2 gap-3">
            {Num({ k: 'age', label: tr('Age', 'उम्र'), suffix: tr('yrs', 'वर्ष') })}
            <label className="block"><span className="text-xs font-semibold text-slate-500">{tr('Pregnancy month', 'गर्भ का महीना')}</span>
              <select value={f.month} onChange={(e) => set('month', e.target.value)} className="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[16px] font-bold">
                {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => <option key={n} value={n}>{n}</option>)}
              </select></label>
            {Num({ k: 'hb', label: 'Hb', suffix: 'g/dL', step: '0.1' })}
            {Num({ k: 'gravida', label: tr('Previous pregnancies', 'पिछली गर्भावस्थाएँ') })}
            {Num({ k: 'bpS', label: tr('BP systolic', 'बीपी ऊपर (सिस्टोलिक)'), suffix: 'mmHg' })}
            {Num({ k: 'bpD', label: tr('BP diastolic', 'बीपी नीचे (डायस्टोलिक)'), suffix: 'mmHg' })}
            <label className="block"><span className="text-xs font-semibold text-slate-500">{tr('Sickle cell status', 'सिकल सेल स्थिति')}</span>
              <select value={f.sickle} onChange={(e) => set('sickle', e.target.value)} className="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-[15px] font-bold">
                <option value="none">{tr('None / not known', 'नहीं / पता नहीं')}</option>
                <option value="trait">{tr('Trait (carrier)', 'वाहक (ट्रेट)')}</option>
                <option value="disease">{tr('Disease', 'रोग')}</option>
              </select></label>
            {Num({ k: 'distance', label: tr('Distance to FRU', 'FRU तक दूरी'), suffix: 'km' })}
          </div>
          <div className="space-y-2">
            {Toggle({ k: 'prevCS', label: tr('Previous C-section', 'पिछला सिज़ेरियन') })}
            {Toggle({ k: 'swelling', label: tr('Swelling of feet / face', 'पैर / चेहरे पर सूजन') })}
            {Toggle({ k: 'lessMove', label: tr('Reduced baby movement', 'शिशु की हलचल कम') })}
            {Toggle({ k: 'headache', label: tr('Severe headache / blurred vision', 'तेज़ सिरदर्द / धुंधला दिखना'), danger: true })}
            {Toggle({ k: 'bleeding', label: tr('Any bleeding', 'कोई भी रक्तस्राव'), danger: true })}
            {Toggle({ k: 'convulsions', label: tr('Convulsions / fits', 'दौरे / झटके'), danger: true })}
          </div>
        </Card>

        <Card className="mt-3 p-4">
          <div className="font-bold text-slate-900">{tr('Why this score?', 'यह स्कोर क्यों?')}</div>
          <div className="text-xs text-slate-500">{tr('Points added by each factor', 'हर कारण से जुड़े अंक')}</div>
          {r.factors.length === 0 && <div className="mt-3 text-sm text-emerald-700 font-semibold flex items-center gap-2"><Icon name="check" className="w-4 h-4" sw={3} />{tr('No risk factors entered', 'कोई जोखिम कारक नहीं')}</div>}
          <div className="mt-3 space-y-2.5">
            {[...r.factors].sort((a, b) => b.pts - a.pts).map((x) => (
              <div key={x.key}>
                <div className="flex justify-between text-[13px]">
                  <span className="font-semibold text-slate-700 flex items-center gap-1">{x.red && <Icon name="alert" className="w-3.5 h-3.5 text-red-600" />}{tx(x.label)}</span>
                  <span className="font-bold text-slate-900">+{x.pts}</span>
                </div>
                <div className="mt-1 h-2.5 rounded-full bg-slate-100 overflow-hidden">
                  <div className={`h-full rounded-full bar-grow ${x.red ? 'bg-red-600' : x.pts >= 18 ? 'bg-orange-500' : 'bg-amber-400'}`} style={{ width: `${Math.min(100, (x.pts / 40) * 100)}%` }} />

          </div>
          <div className="mt-3 text-[11px] text-slate-500">{tr('Bands: 0–19 Green · 20–44 Yellow · 45+ Red. Bleeding, fits, severe headache/blurred vision or BP ≥160/110 = automatic Red.', 'श्रेणी: 0–19 हरा · 20–44 पीला · 45+ लाल। रक्तस्राव, दौरे, तेज़ सिरदर्द/धुंधला दिखना या बीपी ≥160/110 = स्वतः लाल।')}</div>
        </Card>

        <div className="mt-3 grid grid-cols-2 gap-2">
          <button onClick={onSave} className="py-3.5 rounded-2xl bg-white ring-1 ring-slate-200 font-bold text-slate-800 flex items-center justify-center gap-1.5"><Icon name={saved ? 'check' : 'save'} className="w-4 h-4" />{saved ? tr('Saved', 'सेव हुआ') : tr('Save', 'सेव करें')}</button>
          <button onClick={onRefer} disabled={r.band === 'GREEN'} className={`py-3.5 rounded-2xl font-bold text-white flex items-center justify-center gap-1.5 disabled:opacity-40 ${r.band === 'RED' ? 'bg-red-600' : 'bg-amber-500'}`}><Icon name="send" className="w-4 h-4" />{r.band === 'RED' ? tr('Refer now', 'अभी रेफर करें') : tr('Refer to PHC', 'PHC रेफर करें')}</button>
        </div>
        <Disclaimer />
      </div>
    );
  }

  /* ---------- 7.6 Referral ---------- */
  function ReferralScreen({ go, params }) {
    const { tr, tx, lang } = useLang();
    const { state, api } = useStore();
    const [selId, setSelId] = useState(params.refId || null);
    const ref = selId ? state.referrals.find((r) => r.id === selId) : null;
    if (ref) return <ReferralSlip referral={ref} onBack={() => setSelId(null)} />;

    const mine = state.referrals.filter((r) => r.ashaId === ME);
    const activeIds = new Set(mine.filter((r) => r.status !== 'completed').map((r) => r.patientId));
    const candidates = state.patients.filter((p) => p.ashaId === ME && p.risk !== 'GREEN' && !activeIds.has(p.id))
      .sort((a, b) => RISK_RANK[b.risk] - RISK_RANK[a.risk]);
    const create = (p) => {
      const cond = p.type === 'pregnant' ? conditionFromScore(scorePregnancy(pregInputFromPatient(p))) : [p.reasons[0] ? p.reasons[0][0] : 'Needs check-up', p.reasons[0] ? p.reasons[0][1] : 'जाँच ज़रूरी'];
      setSelId(api.createReferral(p.id, { level: p.risk, reasons: p.reasons, condition: cond, source: 'list' }));
    };
    return (
      <div>
        <h3 className="font-bold text-slate-900">{tr('My referrals', 'मेरे रेफरल')}</h3>
        <div className="mt-2 space-y-2">
          {mine.length === 0 && <div className="text-sm text-slate-500">{tr('No referrals yet.', 'अभी कोई रेफरल नहीं।')}</div>}
          {mine.map((r) => {
            const p = state.patients.find((x) => x.id === r.patientId);
            return (
              <button key={r.id} onClick={() => setSelId(r.id)} className="w-full bg-white rounded-2xl p-3 shadow-card ring-1 ring-slate-100 text-left">
                <div className="flex items-center gap-3">
                  <Avatar name={p.name} level={r.level} />
                  <div className="flex-1 min-w-0">
                    <div className="font-semibold truncate">{p.name}</div>
                    <div className="text-xs text-slate-500 truncate">{tx(r.condition)}</div>
                  </div>
                  <Icon name="chevron" className="w-5 h-5 text-slate-400" />
                </div>
                <div className="mt-2 flex items-center justify-between"><StatusPill status={r.status} /><span className="text-[11px] text-slate-500">{r.slipNo} · {fmtTime(r.sentAt || r.createdAt, lang)}</span></div>
              </button>
            );
          })}
        </div>
        <h3 className="mt-5 font-bold text-slate-900">{tr('Patients who may need referral', 'जिन्हें रेफरल चाहिए हो सकता है')}</h3>
        <div className="mt-2 space-y-2">
          {candidates.map((p) => (
            <div key={p.id} className="bg-white rounded-2xl p-3 shadow-card ring-1 ring-slate-100 flex items-center gap-3">
              <Avatar name={p.name} level={p.risk} />
              <div className="flex-1 min-w-0"><div className="font-semibold truncate">{p.name}</div><div className="text-xs text-slate-500 truncate">{patientSubtitle(p, lang)}</div></div>
              <button onClick={() => create(p)} className={`shrink-0 text-sm font-bold rounded-xl px-3 py-2 text-white ${p.risk === 'RED' ? 'bg-red-600' : 'bg-amber-500'}`}>{tr('Slip', 'पर्ची')}</button>
            </div>
          ))}
        </div>
        <Disclaimer />
      </div>
    );
  }

    const idx = STATUS_ORDER.indexOf(r.status);
    const steps = [
      { k: 'draft', t: tr('Slip created', 'पर्ची बनी'), at: r.createdAt, icon: 'file' },
      { k: 'sent', t: tr('Sent to PHC', 'PHC को भेजा'), at: r.sentAt, icon: 'send' },
      { k: 'seen', t: tr('Seen by PHC', 'PHC ने देखा'), at: r.seenAt, icon: 'eye' },

    return (
      <div>
        <button onClick={onBack} className="text-sm font-semibold text-brand-700 flex items-center gap-1"><Icon name="back" className="w-4 h-4" />{tr('All referrals', 'सभी रेफरल')}</button>
        <div className="mt-2 bg-white rounded-3xl shadow-lift ring-1 ring-slate-200 overflow-hidden pop-in">

              <div className="text-[11px] font-bold">{r.slipNo}</div>

            <div className="text-lg font-extrabold leading-tight mt-0.5">{tx(r.condition)}</div>

          </div>
          <div className="p-4 space-y-3 text-[14px]">
            <div className="flex gap-3">
              <div className="flex-1 min-w-0 space-y-1">
                <div className="text-lg font-bold text-slate-900">{p.name}</div>
                <div className="text-slate-600">{patientSubtitle(p, lang)}</div>
                <div className="text-slate-600">{tx(v.name)}, {tx(BLOCK_BY_ID[v.block].name)}</div>
                <div className="text-slate-500 text-xs">ASHA: {lang === 'hi' ? ASHA_BY_ID[r.ashaId].hiName : ASHA_BY_ID[r.ashaId].name}</div>
                <div className="pt-1"><RiskBadge level={r.level} long /></div>
              </div>
              <div className="shrink-0 text-center">
                <div className="p-1.5 rounded-xl ring-1 ring-slate-200"><QRBox seed={r.slipNo} size={96} /></div>
                <div className="text-[9px] text-slate-400 mt-0.5">{tr('Scan at facility (demo)', 'अस्पताल में स्कैन (डेमो)')}</div>
              </div>
            </div>
            <div>
              <div className="text-xs font-bold text-slate-500 uppercase">{tr('Risk reasons', 'जोखिम के कारण')}</div>
              <ul className="mt-1 space-y-1">
                {(r.reasons || []).slice(0, 6).map((x, i) => <li key={i} className="flex gap-1.5 text-slate-800"><Icon name="alert" className="w-4 h-4 text-red-600 shrink-0 mt-0.5" />{tx(x)}</li>)}
              </ul>
            </div>
            <div className="rounded-2xl bg-slate-50 p-3 space-y-2">
              <div className="flex items-center gap-2">
                <span className="w-9 h-9 rounded-xl bg-brand-700 text-white flex items-center justify-center"><Icon name="hospital" className="w-5 h-5" /></span>
                <div className="flex-1 min-w-0"><div className="text-[11px] text-slate-500 font-semibold">{tr('Refer to', 'रेफर करें')} ({target.type}{target.fru ? ' · FRU' : ''})</div><div className="font-bold text-slate-900 truncate">{tx(target.name)}</div></div>
                <div className="text-right"><div className="font-extrabold text-slate-900">{r.distanceKm} km</div><div className="text-[10px] text-slate-500">~{Math.round((r.distanceKm / 40) * 60) + 5} {tr('min', 'मिनट')}</div></div>
              </div>
              <div className="flex justify-between text-xs text-slate-600"><span>{tr('Nearest PHC/CHC', 'नज़दीकी PHC/CHC')}: {tx(phc.name)}</span><span className="font-semibold">{r.phcKm} km</span></div>
              <div className="flex justify-between text-xs text-slate-600"><span>{tr('District Hospital, Shahdol', 'जिला अस्पताल, शहडोल')}</span><span className="font-semibold">{r.dhKm} km</span></div>
            </div>

            {/* Actions */}
            <div className="grid grid-cols-2 gap-2">
              <button onClick={() => api.alertPHC(r.id)} disabled={idx >= 1}
                className="py-4 rounded-2xl bg-brand-700 text-white font-extrabold flex items-center justify-center gap-2 disabled:bg-emerald-600 active:scale-[.98] transition">
                <Icon name={idx >= 1 ? 'check' : 'bell'} className="w-5 h-5" sw={2.5} />{idx >= 1 ? tr('PHC alerted', 'PHC को सूचना गई') : tr('Alert PHC', 'PHC को अलर्ट')}
              </button>
              <button onClick={() => api.call108(r.id)} disabled={idx >= 3}
                className="py-4 rounded-2xl bg-red-600 text-white font-extrabold flex items-center justify-center gap-2 disabled:bg-orange-600 active:scale-[.98] transition">

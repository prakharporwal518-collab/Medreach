            {/* Status timeline */}
            <div className="pt-1">
              <div className="text-xs font-bold text-slate-500 uppercase">{tr('Status', 'स्थिति')}</div>
              <ol className="mt-2 relative">
                {steps.map((s, i) => {
                  const done = STATUS_ORDER.indexOf(s.k) <= idx;
                  const current = STATUS_ORDER.indexOf(s.k) === idx + 1 && idx >= 1;
                  return (
                    <li key={s.k} className="flex gap-3 pb-3 last:pb-0 relative">
                      {i < steps.length - 1 && <span className={`absolute left-[15px] top-8 bottom-0 w-0.5 ${done ? 'bg-emerald-400' : 'bg-slate-200'}`} />}
                      <span className={`w-8 h-8 shrink-0 rounded-full flex items-center justify-center z-10 ${done ? 'bg-emerald-600 text-white' : current ? 'bg-amber-100 text-amber-700 ring-2 ring-amber-300 animate-pulse' : 'bg-slate-100 text-slate-400'}`}>
                        <Icon name={done ? 'check' : s.icon} className="w-4 h-4" sw={2.5} />

                      <div className="pt-1">
                        <div className={`font-semibold ${done ? 'text-slate-900' : 'text-slate-400'}`}>{s.t}</div>

              </ol>

              <div className="rounded-2xl bg-orange-50 ring-1 ring-orange-200 p-3 flex items-center gap-3 pop-in">
                <span className="w-10 h-10 rounded-xl bg-orange-500 text-white flex items-center justify-center"><Icon name="ambulance" className="w-6 h-6" /></span>
                <div className="text-sm">

                </div>
              </div>
            )}
          </div>
        </div>
        <Disclaimer />
      </div>
    );

  /* ---------- 7.7 My patients ---------- */
  function PatientsScreen({ go, params }) {
    const { tr, tx, lang } = useLang();
    const { state } = useStore();
    const [q, setQ] = useState('');
    const [filter, setFilter] = useState(params.filter || 'all');
    const [open, setOpen] = useState(params.open || null);
    const endToday = startOfDay() + DAY;
    const filters = [
      ['all', tr('All', 'सभी')], ['pregnant', tr('Pregnant', 'गर्भवती')], ['child', tr('Children', 'बच्चे')],
      ['sickle', tr('Sickle cell', 'सिकल सेल')], ['red', tr('High risk', 'उच्च जोखिम')], ['today', tr('Due today', 'आज')],
    ];
    const list = state.patients
      .filter((p) => p.ashaId === ME)
      .filter((p) => {
        if (filter === 'pregnant') return p.type === 'pregnant';
        if (filter === 'child') return p.type === 'child';
        if (filter === 'sickle') return p.type === 'sickle' || (p.sickle && p.sickle !== 'none');
        if (filter === 'red') return p.risk === 'RED';
        if (filter === 'today') return p.nextVisit < endToday;
        return true;
      })
      .filter((p) => {
        const s = q.trim().toLowerCase();
        if (!s) return true;
        const v = VILLAGE_BY_ID[p.villageId].name;
        return p.name.toLowerCase().includes(s) || v[0].toLowerCase().includes(s) || v[1].includes(s);
      })
      .sort((a, b) => RISK_RANK[b.risk] - RISK_RANK[a.risk] || a.nextVisit - b.nextVisit);

    return (
      <div>
        <div className="flex items-center gap-2 rounded-2xl bg-white ring-1 ring-slate-200 px-3 shadow-card">
          <Icon name="search" className="w-5 h-5 text-slate-400" />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder={tr('Search name or village…', 'नाम या गाँव खोजें…')} className="flex-1 py-3 text-[15px] outline-none bg-transparent min-w-0" />
          {q && <button onClick={() => setQ('')} aria-label="Clear"><Icon name="x" className="w-4 h-4 text-slate-400" /></button>}
        </div>
        <div className="mt-3 flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 pb-1">
          {filters.map(([k, l]) => (

  function KpiCard({ icon, label, value, sub, tone }) {
    const [flash, setFlash] = useState(0);
    const prev = useRef(value);
    useEffect(() => {
      if (prev.current !== value) { prev.current = value; setFlash((f) => f + 1); }
    }, [value]);
    const tones = { brand: 'bg-brand-50 text-brand-700', red: 'bg-red-50 text-red-700', orange: 'bg-orange-50 text-orange-700', sky: 'bg-sky-50 text-sky-700', rose: 'bg-rose-50 text-rose-700' };
    return (
      <div key={flash} className={`bg-white rounded-2xl p-4 shadow-card ring-1 ring-slate-100 ${flash ? 'kpi-flash' : ''}`}>

          <span className="text-[13px] font-semibold text-slate-500 leading-tight">{label}</span>
        </div>
        <div className="mt-2 text-3xl font-extrabold text-slate-900 tabular-nums">{value}</div>

  /** Chart.js wrapper: creates once, updates data in place. Falls back to a list if Chart.js is missing. */
  function ChartBox({ type, data, options, height = 210 }) {
    const canvasRef = useRef(null);
    const chartRef = useRef(null);
    const json = JSON.stringify(data);
    useEffect(() => {
      if (!window.Chart || !canvasRef.current) return;
      chartRef.current = new window.Chart(canvasRef.current.getContext('2d'), { type, data: JSON.parse(json), options });
      return () => { chartRef.current && chartRef.current.destroy(); chartRef.current = null; };
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [type]);
    useEffect(() => {
      const ch = chartRef.current;
      if (!ch) return;
      const d = JSON.parse(json);
      ch.data.labels = d.labels;
      d.datasets.forEach((ds, i) => { if (ch.data.datasets[i]) Object.assign(ch.data.datasets[i], ds); else ch.data.datasets.push(ds); });
      ch.update();
    }, [json]);
    if (!window.Chart) {
      return (
        <div className="text-sm space-y-1.5" style={{ minHeight: height }}>
          {data.labels.map((l, i) => <div key={i} className="flex justify-between border-b border-slate-100 py-1"><span>{l}</span><span className="font-bold">{data.datasets[0].data[i]}</span></div>)}
        </div>
      );
    }
    return <div style={{ height }} className="relative"><canvas ref={canvasRef} /></div>;
  }

  /** Leaflet risk map with village markers, facilities and pulsing live referrals. */
  function RiskMap({ patients, referrals, alerts, height }) {
    const { tx, lang, tr } = useLang();
    const elRef = useRef(null);
    const mapRef = useRef(null);
    const layerRef = useRef(null);
    const fitted = useRef(false);
    const opened = useRef(null);
    const hasLeaflet = !!window.L;

    useEffect(() => {
      if (!hasLeaflet || !elRef.current) return;
      const L = window.L;
      const map = L.map(elRef.current, { scrollWheelZoom: false, zoomControl: true }).setView([23.3, 81.36], 9);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
      layerRef.current = L.layerGroup().addTo(map);
      mapRef.current = map;
      let ro;
      if (window.ResizeObserver) { ro = new ResizeObserver(() => map.invalidateSize()); ro.observe(elRef.current); }
      const t = setTimeout(() => map.invalidateSize(), 300);
      return () => { clearTimeout(t); ro && ro.disconnect(); map.remove(); mapRef.current = null; };
    }, [hasLeaflet]);

    useEffect(() => {
      const map = mapRef.current, layer = layerRef.current, L = window.L;
      if (!map || !layer) return;
      layer.clearLayers();
      const bounds = [];
      // Villages coloured by their highest-risk patient
      VILLAGES.forEach((v) => {
        const ps = patients.filter((p) => p.villageId === v.id);
        const c = { RED: 0, YELLOW: 0, GREEN: 0 };
        ps.forEach((p) => { c[p.risk]++; });
        const worst = c.RED ? 'RED' : c.YELLOW ? 'YELLOW' : 'GREEN';
        const asha = ASHAS.find((a) => a.villages.includes(v.id));
        const html = `<div style="min-width:170px"><b style="font-size:14px">${escapeHtml(tx(v.name))}</b><br/>
          <span style="color:#64748b">${escapeHtml(tx(BLOCK_BY_ID[v.block].name))} · ASHA ${escapeHtml(lang === 'hi' ? asha.hiName : asha.name)}</span>
          <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap">
          <span>🔴 ${c.RED} ${tr('High', 'उच्च')}</span><span>🟡 ${c.YELLOW} ${tr('Watch', 'निगरानी')}</span><span>🟢 ${c.GREEN} ${tr('Low', 'कम')}</span></div>
          <div style="margin-top:4px;color:#64748b">${tr('Nearest FRU', 'नज़दीकी FRU')}: ${v.fruKm} km</div></div>`;
        L.circleMarker([v.lat, v.lng], { radius: 8 + Math.min(8, ps.length * 1.5), color: '#fff', weight: 2.5, fillColor: RISK_META[worst].hex, fillOpacity: 0.9 })
          .bindPopup(html).bindTooltip(tx(v.name), { direction: 'top', offset: [0, -8] }).addTo(layer);
        bounds.push([v.lat, v.lng]);
      });
      // Facilities
      FACILITIES.forEach((f) => {
        L.marker([f.lat, f.lng], { icon: L.divIcon({ className: '', html: `<div class="fac-icon ${f.type === 'DH' ? 'dh' : ''}">${f.type === 'DH' ? 'H' : '+'}</div>`, iconSize: f.type === 'DH' ? [24, 24] : [20, 20], iconAnchor: f.type === 'DH' ? [12, 12] : [10, 10] }) })
          .bindPopup(`<b>${escapeHtml(tx(f.name))}</b><br/>${f.type}${f.fru ? ' · FRU (C-section, blood bank)' : ''}`).addTo(layer);
      });
      // Live referrals (pulsing red)
      const newest = alerts[0];
      const isFresh = newest && Date.now() - newest.at < 20000;
      referrals.filter((r) => ACTIVE_STATUSES.includes(r.status)).forEach((r) => {
        const p = patients.find((x) => x.id === r.patientId);
        if (!p) return;
        const v = VILLAGE_BY_ID[p.villageId];
        const ang = (hashStr(r.id) % 360) * (Math.PI / 180);
        const isNew = isFresh && newest.referralId === r.id;
        const size = isNew ? 26 : 18;
        const mk = L.marker([v.lat + 0.018 * Math.sin(ang), v.lng + 0.022 * Math.cos(ang)], {
          icon: L.divIcon({ className: '', html: `<div class="map-pulse ${isNew ? 'is-new' : ''}"></div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2] }),
          zIndexOffset: isNew ? 2000 : 1000,
        }).bindPopup(`<div style="min-width:180px"><b style="color:#b91c1c">🚨 ${escapeHtml(p.name)}</b><br/>${escapeHtml(tx(r.condition))}<br/>
          <span style="color:#64748b">${escapeHtml(tx(v.name))} · ${escapeHtml(tx(STATUS_META[r.status].label))}</span><br/>
          <span style="color:#64748b">→ ${escapeHtml(tx(FAC_BY_ID[r.facilityId].name))} (${r.distanceKm} km)</span></div>`).addTo(layer);
        if (isNew && opened.current !== r.id) { opened.current = r.id; setTimeout(() => { if (mapRef.current) mk.openPopup(); }, 150); }
      });
      if (!fitted.current && bounds.length) { map.fitBounds(bounds, { padding: [24, 24] }); fitted.current = true; }
    }, [patients, referrals, alerts, lang]);

    const legend = (
      <div className="absolute left-2 bottom-2 z-[500] bg-white/95 rounded-xl shadow-card px-2.5 py-1.5 text-[11px] font-semibold text-slate-700 flex flex-wrap gap-x-3 gap-y-1 max-w-[95%]">
        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-red-600" />{tr('High', 'उच्च')}</span>
        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-amber-500" />{tr('Watch', 'निगरानी')}</span>
        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-emerald-600" />{tr('Low', 'कम')}</span>
        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-red-600 pulse-dot" />{tr('Live referral', 'लाइव रेफरल')}</span>
        <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-brand-700 text-white text-[8px] leading-3 text-center">+</span>{tr('Facility', 'अस्पताल')}</span>
      </div>
    );
    if (!hasLeaflet) return <div className="relative rounded-2xl overflow-hidden" style={{ height }}><FallbackMap patients={patients} referrals={referrals} />{legend}</div>;
    return <div className="relative rounded-2xl overflow-hidden isolate" style={{ height }}><div ref={elRef} className="absolute inset-0" />{legend}</div>;
  }

  /** Simple SVG grid map used when Leaflet cannot load. */
  function FallbackMap({ patients, referrals }) {
    const { tx } = useLang();
    const [sel, setSel] = useState(null);
    const W = 640, H = 420, lat0 = 23.0, lat1 = 24.08, lng0 = 81.2, lng1 = 81.9;
    const px = (lng) => ((lng - lng0) / (lng1 - lng0)) * W;
    const py = (lat) => H - ((lat - lat0) / (lat1 - lat0)) * H;
    return (
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full bg-[#e7f0ee]" preserveAspectRatio="xMidYMid meet">
        {Array.from({ length: 12 }, (_, i) => <line key={'v' + i} x1={(i * W) / 11} y1="0" x2={(i * W) / 11} y2={H} stroke="#d2e0dd" />)}
        {Array.from({ length: 9 }, (_, i) => <line key={'h' + i} x1="0" y1={(i * H) / 8} x2={W} y2={(i * H) / 8} stroke="#d2e0dd" />)}
        {BLOCKS.map((b) => <text key={b.id} x={px(b.lng)} y={py(b.lat) - 22} textAnchor="middle" fontSize="13" fontWeight="700" fill="#0f665e" opacity=".7">{tx(b.name)}</text>)}
        {FACILITIES.map((f) => <rect key={f.id} x={px(f.lng) - 7} y={py(f.lat) - 7} width="14" height="14" rx="3" fill={f.type === 'DH' ? '#1e3a8a' : '#0f665e'} stroke="#fff" strokeWidth="2"><title>{tx(f.name)}</title></rect>)}
        {VILLAGES.map((v) => {
          const ps = patients.filter((p) => p.villageId === v.id);
          const worst = ps.some((p) => p.risk === 'RED') ? 'RED' : ps.some((p) => p.risk === 'YELLOW') ? 'YELLOW' : 'GREEN';
          return (
            <g key={v.id} onClick={() => setSel(v.id)} style={{ cursor: 'pointer' }}>
              <circle cx={px(v.lng)} cy={py(v.lat)} r={8 + Math.min(8, ps.length * 1.5)} fill={RISK_META[worst].hex} stroke="#fff" strokeWidth="2.5" />
              <text x={px(v.lng)} y={py(v.lat) + 26} textAnchor="middle" fontSize="11" fill="#334155">{tx(v.name)}</text>
              <title>{`${tx(v.name)}: ${ps.length}`}</title>
            </g>
          );
        })}
        {referrals.filter((r) => ACTIVE_STATUSES.includes(r.status)).map((r) => {
          const p = patients.find((x) => x.id === r.patientId);
          if (!p) return null;
          const v = VILLAGE_BY_ID[p.villageId];
          const ang = (hashStr(r.id) % 360) * (Math.PI / 180);
          const x = px(v.lng + 0.022 * Math.cos(ang)), y = py(v.lat + 0.018 * Math.sin(ang));
          return (
            <g key={r.id}>
              <circle cx={x} cy={y} r="7" fill="none" stroke="#dc2626" strokeWidth="2"><animate attributeName="r" from="7" to="20" dur="1.6s" repeatCount="indefinite" /><animate attributeName="opacity" from="1" to="0" dur="1.6s" repeatCount="indefinite" /></circle>
              <circle cx={x} cy={y} r="7" fill="#dc2626" stroke="#fff" strokeWidth="2"><title>{`${p.name}: ${tx(r.condition)}`}</title></circle>
            </g>
          );
        })}
        {sel && <text x="12" y="22" fontSize="13" fontWeight="700" fill="#0f172a">{tx(VILLAGE_BY_ID[sel].name)} — {patients.filter((p) => p.villageId === sel).length} patients</text>}
      </svg>
    );
  }

  function HotspotCard({ compact }) {
    const { tr, tx } = useLang();
    const { api } = useStore();
    const rows = useMemo(() => BLOCKS.map((b) => {
      const s = ANAEMIA_WEEKLY[b.id];
      const prev = sum(s.slice(0, 4)), last = sum(s.slice(4));
      return { b, s, growth: Math.round(((last - prev) / prev) * 100) };
    }).sort((a, b) => b.growth - a.growth), []);
    const top = rows[0];
    const max = Math.max(...top.s), min = Math.min(...top.s);
    const pts = top.s.map((v, i) => `${(i / 7) * 100},${36 - ((v - min) / (max - min || 1)) * 32}`).join(' ');
    return (
      <div className="rounded-2xl p-4 bg-gradient-to-br from-amber-50 to-orange-50 ring-1 ring-orange-200 shadow-card h-full">
        <div className="flex items-center gap-2">
          <span className="w-9 h-9 rounded-xl bg-orange-500 text-white flex items-center justify-center"><Icon name="trend" className="w-5 h-5" /></span>
          <div>
            <div className="font-bold text-slate-900">{tr('Predictive hotspot', 'संभावित हॉटस्पॉट')}</div>
            <div className="text-[11px] text-orange-800">{tr('Rule-based forecast · last 4 weeks vs previous 4', 'नियम-आधारित पूर्वानुमान · पिछले 4 बनाम उससे पहले के 4 सप्ताह')}</div>
          </div>

        <div className="mt-3 text-[15px] leading-snug text-slate-800">
          <b className="text-orange-800">{tx(top.b.name)} {tr('block', 'ब्लॉक')}:</b>{' '}

            <>अगले महीने एनीमिया के मामलों में <b>{top.growth}% वृद्धि</b> की संभावना। <b>IFA अभियान + Hb कैंप</b> का सुझाव।</>)}

          ))}

      </div>

  /* ---------------------------------------------------------------------
     10. APP ROOT — shared state + actions (the "API" both sides use)
     --------------------------------------------------------------------- */
  function App() {
    const [lang, setLang] = useState('en');
    const [view, setView] = useState('landing');
    const [about, setAbout] = useState(false);
    const [toasts, setToasts] = useState([]);
    const [state, dispatch] = useReducer(reducer, null, initState);
    const stateRef = useRef(state);
    stateRef.current = state;
    const timers = useRef([]);

    useEffect(() => { window.__SEHAT_SETU_MOUNTED = true; document.documentElement.lang = lang; }, [lang]);
    useEffect(() => () => timers.current.forEach(clearTimeout), []);
    useEffect(() => {
      if (window.Chart) { window.Chart.defaults.font.family = "Inter, 'Noto Sans Devanagari', sans-serif"; window.Chart.defaults.color = '#475569'; }
    }, []);

    const dismiss = useCallback((id) => setToasts((t) => t.filter((x) => x.id !== id)), []);
    const toast = useCallback((text, kind = 'success') => {
      const id = uid('t');
      setToasts((t) => [...t.slice(-3), { id, text, kind }]);
      setTimeout(() => dismiss(id), 3800);
    }, [dismiss]);

    const api = useMemo(() => {
      const later = (fn, ms) => { timers.current.push(setTimeout(fn, ms)); };
      const getRef = (id) => stateRef.current.referrals.find((r) => r.id === id);
      const getPatient = (id) => stateRef.current.patients.find((p) => p.id === id);
      const self = {
        toast,
        addPatient: (p) => { dispatch({ type: 'UPSERT_PATIENT', patient: p }); dispatch({ type: 'LOG_VISIT', ashaId: p.ashaId }); },
        updatePatient: (p) => {
          dispatch({ type: 'UPSERT_PATIENT', patient: p });
          const cur = getPatient(p.id);
          if (cur) dispatch({ type: 'LOG_VISIT', ashaId: cur.ashaId, flagged: p.risk === 'RED' && cur.risk !== 'RED' });
        },
        /** Save a voice check-up result on the patient's record. */
        saveCheckup: (patientId, r) => {
          const cur = getPatient(patientId);
          if (!cur) return;
          dispatch({ type: 'UPSERT_PATIENT', patient: { id: patientId, ...r.patientUpdates, risk: r.level, reasons: r.signs, lastVisit: Date.now() } });
          dispatch({ type: 'LOG_VISIT', ashaId: cur.ashaId, flagged: r.level === 'RED' && cur.risk !== 'RED' });
          toast(['Check-up saved to patient record', 'जाँच मरीज़ के रिकॉर्ड में सेव हुई'], 'success');
        },
        /** Create a referral slip (draft). It reaches the district when "Alert PHC" is tapped. */
        createReferral: (patientId, info) => {
          const p = getPatient(patientId);
          const level = info.level || 'RED';
          const id = uid('r');
          const count = stateRef.current.referrals.length;
          const referral = {
            id, slipNo: `SS-26-${String(1031 + count).padStart(4, '0')}`, patientId, ashaId: p.ashaId, level,
            reasons: info.reasons || p.reasons, condition: info.condition || ['Referral', 'रेफरल'],
            ...referralTargets(p.villageId, level), status: 'draft', source: info.source || 'app',
            createdAt: Date.now(), sentAt: null, seenAt: null, ambulanceAt: null, completedAt: null, ambulance: null,
            patientUpdates: info.patientUpdates || {},
          };
          dispatch({ type: 'ADD_REFERRAL', referral });
          return id;
        },
        /** Send the referral to the PHC → appears instantly on the district dashboard. */
        alertPHC: (refId) => {
          const r = getRef(refId);
          if (!r || r.status !== 'draft') return;
          const at = Date.now();
          const p = getPatient(r.patientId);
          dispatch({ type: 'REFERRAL_STATUS', id: refId, status: 'sent', at });
          dispatch({ type: 'UPSERT_PATIENT', patient: { id: p.id, ...(r.patientUpdates || {}), risk: RISK_RANK[r.level] > RISK_RANK[p.risk] || r.level === 'RED' ? r.level : p.risk, reasons: r.reasons, lastVisit: at } });
          dispatch({ type: 'ADD_ALERT', alert: { id: uid('al'), referralId: refId, patientId: p.id, ashaId: r.ashaId, level: r.level, condition: r.condition, at } });
          dispatch({ type: 'LOG_VISIT', ashaId: r.ashaId, flagged: true });
          toast([`PHC alerted: ${FAC_BY_ID[r.phcId].name[0]} has the referral for ${p.name}`, `PHC को सूचना: ${FAC_BY_ID[r.phcId].name[1]} को ${p.name} का रेफरल मिला`], 'alert');
          later(() => {
            dispatch({ type: 'REFERRAL_STATUS', id: refId, status: 'seen', at: Date.now() });
            const cur = getRef(refId);
            if (cur && cur.status === 'seen') toast([`Seen by ${FAC_BY_ID[r.phcId].name[0]} — Medical Officer notified`, `${FAC_BY_ID[r.phcId].name[1]} ने देखा — चिकित्सा अधिकारी को सूचना`], 'info');
          }, 4000);
        },
        /** Simulated 108 call → ambulance assigned. */
        call108: (refId) => {
          const r = getRef(refId);
          if (!r || STATUS_ORDER.indexOf(r.status) >= 3) return;
          if (r.status === 'draft') self.alertPHC(refId);
          toast(['Calling 108 ambulance… 📞', '108 एम्बुलेंस को कॉल हो रहा है… 📞'], 'info');
          later(() => {
            const amb = makeAmbulance(refId, r.distanceKm);
            dispatch({ type: 'REFERRAL_STATUS', id: refId, status: 'ambulance', at: Date.now(), extra: { ambulance: amb } });
            toast([`Ambulance ${amb.vehicle} assigned · ETA ${amb.etaMin} min`, `एम्बुलेंस ${amb.vehicle} रवाना · ${amb.etaMin} मिनट में`], 'success');
          }, 2600);
        },
        completeReferral: (refId) => {
          dispatch({ type: 'REFERRAL_STATUS', id: refId, status: 'completed', at: Date.now() });
          toast(['Patient reached the facility ✔', 'मरीज़ अस्पताल पहुँच गया ✔'], 'success');
        },
        addScreening: (s) => {
          dispatch({ type: 'ADD_SCREENING', screening: s });
          const p = getPatient(s.patientId);
          if (p) {
            dispatch({ type: 'UPSERT_PATIENT', patient: { id: p.id, anaemiaScreen: s.category, lastVisit: Date.now() } });
            dispatch({ type: 'LOG_VISIT', ashaId: p.ashaId });
          }
          toast(['Anaemia screening saved — dashboard updated', 'एनीमिया जाँच सेव हुई — डैशबोर्ड अपडेट'], 'success');
        },
        reset: () => {
          timers.current.forEach(clearTimeout); timers.current = [];
          dispatch({ type: 'RESET' });
          toast(['Demo data reset', 'डेमो डेटा रीसेट हुआ'], 'info');
        },
      };
      return self;
    }, [toast]);

    const langValue = useMemo(() => ({
      lang, setLang,
      tr: (en, hi) => (lang === 'hi' ? hi : en),
      tx: (pair) => pick(pair, lang),
    }), [lang]);
    const store = useMemo(() => ({ state, api }), [state, api]);

    return (
      <LangCtx.Provider value={langValue}>
        <StoreCtx.Provider value={store}>
          <div className="h-screen flex flex-col">
            <Header view={view} setView={setView} onAbout={() => setAbout(true)} onReset={api.reset} />
            <main className="flex-1 min-h-0">
              {view === 'landing' && <Landing setView={setView} />}
              {view === 'asha' && <AshaView />}
              {view === 'officer' && <div className="h-full overflow-y-auto thin-scroll"><Dashboard /></div>}
              {view === 'demo' && <DemoView />}
            </main>
            <Footer />
          </div>
          <Toasts toasts={toasts} dismiss={dismiss} />
          {about && <AboutModal onClose={() => setAbout(false)} />}
        </StoreCtx.Provider>
      </LangCtx.Provider>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
